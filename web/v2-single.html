<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INSIDUS — From the Chilean Pacific to the world</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..600,0,0&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/* ============================================================================
   INSIDUS — visual system
   A dark maritime ground, editorial type, hairline structure and a great deal
   of air. Two loaded families and no more: a display serif for voice, a
   grotesk for everything else. Microtype is the grotesk tracked wide, not a
   third webfont — cheaper, and it reads corporate rather than technical.
   Every colour is painted explicitly; nothing is left to the host.
   ========================================================================= */

:root{
  color-scheme: dark;

  /* --- ground ----------------------------------------------------------- */
  --abyss:   #04070B;   /* near-black — the ground */
  --deep:    #0A141D;   /* deep navy — alternating bands */
  --navy:    #0F2130;   /* raised surfaces */
  --tide:    #17384F;   /* ocean blue, very restrained — fields, never text */
  --ice:     #F1F4F6;   /* off-white — primary text          17.5:1 on abyss */
  --fog:     #93A3B0;   /* cool grey — secondary text          7.6:1 on abyss */
  --accent:  #A9C3D4;   /* pale cold blue — rules, marks      10.7:1 on abyss */

  /* --- derived; all defined here so nothing lives only in a media block -- */
  --hairline:   rgba(169,195,212,.16);
  --hairline-2: rgba(169,195,212,.055);
  --ice-dim:    rgba(241,244,246,.68);
  --scrim-hero: linear-gradient(180deg,
                  rgba(4,7,11,.62) 0%, rgba(4,7,11,.34) 32%,
                  rgba(4,7,11,.72) 78%, rgba(4,7,11,.96) 100%);
  --scrim-film: linear-gradient(180deg,
                  rgba(4,7,11,.72) 0%, rgba(4,7,11,.38) 45%, rgba(4,7,11,.86) 100%);
  --wash:       radial-gradient(120% 78% at 50% 0%,
                  rgba(23,56,79,.42) 0%, rgba(4,7,11,0) 64%);

  /* --- type ------------------------------------------------------------- */
  --display: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans:    "Schibsted Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:    ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --step--2: clamp(.66rem, .63rem + .10vw, .72rem);
  --step--1: clamp(.76rem, .72rem + .14vw, .85rem);
  --step-0:  clamp(1rem, .95rem + .24vw, 1.12rem);
  --step-1:  clamp(1.18rem, 1.06rem + .5vw, 1.5rem);
  --step-2:  clamp(1.55rem, 1.25rem + 1.3vw, 2.5rem);
  --step-3:  clamp(2.1rem, 1.4rem + 3vw, 4.4rem);
  --step-4:  clamp(2.9rem, 1.4rem + 6.4vw, 8.4rem);
  --step-5:  clamp(3.3rem, 1.1rem + 9vw, 11rem);
  --step-6:  clamp(3.8rem, .5rem + 13vw, 15rem);   /* the wordmark, alone */

  /* --- rhythm: the site breathes ---------------------------------------- */
  --gutter:  clamp(1.25rem, 4.5vw, 4rem);
  --measure: 56ch;
  --band:    clamp(5.5rem, 13vh, 11rem);
  --shell:   1560px;
  --ease:    cubic-bezier(.22,.72,.28,1);
}

/* ---------------------------------------------------------------- base --- */
*,*::before,*::after{ box-sizing:border-box }
html{ -webkit-text-size-adjust:100% }
body{
  margin:0; background:var(--abyss); color:var(--ice);
  font-family:var(--sans); font-size:var(--step-0); line-height:1.6;
  font-weight:400; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
img,svg,video{ display:block; max-width:100% }
a{ color:inherit; text-decoration:none }
button,input,select,textarea{ font:inherit; color:inherit }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px }
::selection{ background:var(--tide); color:var(--ice) }

/* ------------------------------------------------------------- layout --- */
.shell{ width:min(var(--shell), 100% - (var(--gutter) * 2)); margin-inline:auto }
.shell--narrow{ width:min(1080px, 100% - (var(--gutter) * 2)); margin-inline:auto }
.band{ padding-block:var(--band); position:relative }
.band--deep{ background:var(--deep) }
.band--tight{ padding-block:calc(var(--band) * .58) }
.rule{ height:1px; background:var(--hairline); border:0; margin:0 }

/* The hairline column grid is part of the identity: it sits behind
   everything at very low contrast and never moves. */
.gridlines{
  /* Above the section backgrounds, not behind them: at this alpha it reads as
     one continuous registration grid down the whole page instead of blinking
     on wherever a band happens to be unpainted. */
  position:fixed; inset:0; z-index:5; pointer-events:none;
  width:min(var(--shell), 100% - (var(--gutter) * 2)); margin-inline:auto;
  display:grid; grid-template-columns:repeat(4, 1fr);
}
.gridlines span{ border-left:1px solid var(--hairline-2) }
.gridlines span:last-child{ border-right:1px solid var(--hairline-2) }
@media (width >= 1100px){ .gridlines{ grid-template-columns:repeat(12, 1fr) } }
main,header,footer{ position:relative; z-index:1 }

/* --------------------------------------------------------- microtype --- */
/* The grotesk tracked wide. No third family, and it reads as a corporate
   label rather than a terminal. */
.tag{
  font-family:var(--sans); font-weight:500; font-size:var(--step--2);
  letter-spacing:.24em; text-transform:uppercase; color:var(--fog); margin:0;
}
.tag--accent{ color:var(--accent) }
.num{
  font-family:var(--sans); font-weight:500; font-size:var(--step--2);
  letter-spacing:.18em; color:var(--accent); font-variant-numeric:tabular-nums;
}
.coord{
  font-family:var(--sans); font-weight:500; font-size:var(--step--2);
  letter-spacing:.22em; text-transform:uppercase; color:var(--fog);
}
.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums }

/* -------------------------------------------------------------- type --- */
.display{
  font-family:var(--display); font-weight:400; font-optical-sizing:auto;
  line-height:.96; letter-spacing:-.012em; margin:0; text-wrap:balance;
}
.h-xl{ font-size:var(--step-5); line-height:.9 }
.h-lg{ font-size:var(--step-4); line-height:.92 }
.h-md{ font-size:var(--step-3); line-height:.98 }
/* Section headings sit a full step under the wordmark: the hero is the
   only place on the site where type is allowed to be enormous. */
.h-sec{ font-size:clamp(2rem, 1.15rem + 3.1vw, 4.6rem); line-height:.96; max-width:17ch }
.h-sm{ font-size:var(--step-2); line-height:1.06 }
.upper{ text-transform:uppercase; letter-spacing:.005em }
.lead{
  color:var(--fog); max-width:var(--measure); font-size:var(--step-1);
  line-height:1.5; margin:0; text-wrap:pretty;
}
.body{ color:var(--ice-dim); max-width:var(--measure); margin:0; text-wrap:pretty }
.stack > * + *{ margin-top:1.15rem }
.stack-lg > * + *{ margin-top:2.6rem }
/* A section head: label, then the statement, then the qualifier. */
.head{ display:grid; gap:1.3rem; margin-bottom:clamp(3rem,8vh,6rem) }
.head .lead{ max-width:46ch }
.head .lead{ margin-top:.4rem }

/* ------------------------------------------------------------ navbar --- */
/* Transparent over the hero; once the hero is behind us it becomes a thin
   translucent bar with a very small blur. Never a slab. */
.nav{
  position:fixed; inset:0 0 auto; z-index:60;
  border-bottom:1px solid transparent;
  transition:background .55s var(--ease), border-color .55s var(--ease),
             backdrop-filter .55s var(--ease), padding .55s var(--ease);
}
.nav.is-solid{
  background:rgba(4,7,11,.72); border-bottom-color:var(--hairline);
  -webkit-backdrop-filter:blur(16px) saturate(120%);
          backdrop-filter:blur(16px) saturate(120%);
}
.nav__in{
  width:min(var(--shell), 100% - (var(--gutter) * 2)); margin-inline:auto;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding-block:clamp(1.1rem,2.4vh,1.7rem);
  transition:padding .55s var(--ease);
}
.nav.is-solid .nav__in{ padding-block:.95rem }
.nav__brand{
  font-family:var(--sans); font-weight:500; font-size:var(--step--1);
  letter-spacing:.42em; text-transform:uppercase; color:var(--ice);
  padding-right:.42em;   /* the last letter keeps its tracking */
}
.nav__right{ display:flex; align-items:center; gap:clamp(1rem,2.6vw,2.6rem) }
.nav__links{ display:flex; gap:clamp(1rem,2.1vw,2.2rem); list-style:none; margin:0; padding:0 }
.nav__links a{
  font-family:var(--sans); font-weight:500; font-size:var(--step--2);
  letter-spacing:.2em; text-transform:uppercase; color:var(--fog);
  padding-block:.4rem; border-bottom:1px solid transparent;
  transition:color .35s var(--ease), border-color .35s var(--ease);
}
.nav__links a:hover, .nav__links a[aria-current="true"]{
  color:var(--ice); border-bottom-color:var(--accent);
}
.nav__toggle{
  display:none; background:none; border:0; cursor:pointer; padding:.4rem 0;
  font-family:var(--sans); font-weight:500; font-size:var(--step--2);
  letter-spacing:.2em; text-transform:uppercase; color:var(--ice);
}

/* language selector — no chrome, no flags */
.lang{ position:relative }
.lang__btn{
  background:none; border:1px solid var(--hairline); cursor:pointer;
  padding:.46rem .85rem; font-family:var(--sans); font-weight:500;
  font-size:var(--step--2); letter-spacing:.18em; color:var(--ice);
  transition:border-color .35s var(--ease), background .35s var(--ease);
}
.lang__btn:hover{ border-color:var(--accent); background:rgba(169,195,212,.06) }
.lang__menu{
  position:absolute; right:0; top:calc(100% + .55rem); min-width:10.5rem;
  background:var(--navy); border:1px solid var(--hairline); padding:.3rem;
  display:none; z-index:70;
}
.lang.is-open .lang__menu{ display:block }
.lang__menu a{
  display:flex; justify-content:space-between; gap:1rem; padding:.55rem .75rem;
  font-size:var(--step--1); color:var(--fog);
  transition:background .25s, color .25s;
}
.lang__menu a span:last-child{ letter-spacing:.14em; font-size:var(--step--2); font-weight:500 }
.lang__menu a:hover, .lang__menu a[aria-current="true"]{
  background:rgba(169,195,212,.09); color:var(--ice);
}

/* mobile fullscreen menu */
.menu{
  position:fixed; inset:0; z-index:65; background:var(--abyss);
  display:none; flex-direction:column; padding:var(--gutter);
}
.menu.is-open{ display:flex }
.menu__head{ display:flex; align-items:center; justify-content:space-between }
.menu__list{ list-style:none; margin:auto 0; padding:0; display:grid; gap:.5rem }
.menu__list a{
  font-family:var(--display); font-size:var(--step-3); line-height:1.02;
  text-transform:uppercase; color:var(--ice); display:flex;
  align-items:baseline; gap:1.1rem;
}
.menu__list .num{ font-size:var(--step--2) }
@media (width < 1024px){
  .nav__links{ display:none }
  .nav__toggle{ display:block }
}

/* ===================== MEDIA FRAMES AND PLACEHOLDERS ==================== */
/* Every photograph and every video on this site enters through a frame.
   Until the asset exists the frame renders a placeholder that names the file
   it is waiting for, so replacing artwork never touches layout or code. */
.frame{ position:relative; overflow:hidden; background:var(--navy) }
.frame > img, .frame > video{
  width:100%; height:100%; object-fit:cover; display:block;
}
.ph{
  position:absolute; inset:0; display:grid; place-content:center;
  gap:.75rem; text-align:center; padding:1.5rem;
  background:
    linear-gradient(180deg, rgba(23,56,79,.30), rgba(4,7,11,.10)),
    repeating-linear-gradient(135deg,
      rgba(169,195,212,.05) 0 1px, rgba(169,195,212,0) 1px 14px);
  border:1px solid var(--hairline);
}
.ph__k{ font-size:var(--step--2); letter-spacing:.24em; text-transform:uppercase; color:var(--accent); font-weight:500 }
.ph__f{ font-family:var(--mono); font-size:var(--step--1); color:var(--ice) }
.ph__d{ font-size:var(--step--2); letter-spacing:.14em; color:var(--fog); text-transform:uppercase }
.ph__ref{ margin:.4rem auto 0; width:84px; height:84px; object-fit:cover; opacity:.55; filter:grayscale(1) }

/* ============================== 01 — HERO ============================== */
/* Built as three layers: media, scrim, content. Drop a still or a looping
   video into .hero__media and nothing else has to change. */
.hero{
  position:relative; min-height:100svh; display:grid; align-content:end;
  overflow:hidden; background:var(--abyss);
}
.hero__media{ position:absolute; inset:0; z-index:0; background:var(--abyss) }
.hero__media > img, .hero__media > video{ width:100%; height:100%; object-fit:cover }
.hero__media .ph{ border:0; background:
    linear-gradient(180deg, rgba(15,33,48,.9), rgba(4,7,11,1)),
    repeating-linear-gradient(135deg,
      rgba(169,195,212,.04) 0 1px, rgba(169,195,212,0) 1px 18px);
  place-content:center; }
.hero__scrim{ position:absolute; inset:0; z-index:1; background:var(--scrim-hero); pointer-events:none }
.hero__scrim::after{ content:""; position:absolute; inset:0; background:var(--wash) }
.hero__in{
  position:relative; z-index:3;
  padding-block:clamp(9rem,20vh,14rem) clamp(6rem,14vh,9rem);
}
.hero__eyebrow{ display:flex; align-items:center; gap:1.1rem; margin:0 0 clamp(2.5rem,7vh,4.5rem) }
.hero__eyebrow i{ display:block; width:clamp(32px,7vw,80px); height:1px; background:var(--accent); font-style:normal }
.hero__brand{
  font-family:var(--display); font-weight:300; font-size:var(--step-6);
  line-height:.84; letter-spacing:clamp(.01em,.55vw,.085em);
  text-transform:uppercase; margin:0; color:var(--ice);
  padding-right:.085em;
}
.hero__claim{
  font-family:var(--display); font-weight:400; font-size:var(--step-2);
  line-height:1.12; letter-spacing:.005em; color:var(--fog);
  margin:clamp(1.8rem,4.5vh,3rem) 0 0; max-width:22ch;
}
.hero__claim b{ color:var(--ice); font-weight:400; display:block }
.hero__foot{
  position:absolute; inset:auto 0 0; z-index:3; padding-block:1.7rem;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
}
.hero__scroll{ display:flex; align-items:center; gap:.8rem }
.hero__scroll i{ display:block; width:46px; height:1px; background:var(--fog); font-style:normal }

/* ======================= 02 — BRAND STATEMENT ========================== */
/* One sentence, an enormous amount of air, and a short paragraph beneath. */
.statement{
  position:relative; padding-block:clamp(8rem,22vh,16rem);
  background:linear-gradient(180deg, var(--abyss) 0%, var(--deep) 55%, var(--abyss) 100%);
  overflow:hidden;
}
.statement__in{ position:relative; z-index:2 }
.statement__line{
  font-family:var(--display); font-weight:300; font-size:var(--step-3);
  line-height:1.06; letter-spacing:-.012em; color:var(--ice);
  margin:1.8rem 0 0; max-width:20ch; text-wrap:balance;
}
.statement__line em{ font-style:italic; color:var(--accent) }
.statement__grid{
  display:grid; gap:clamp(2.5rem,6vw,6rem); grid-template-columns:1fr;
  margin-top:clamp(3.5rem,10vh,7rem); align-items:start;
}
@media (width >= 900px){ .statement__grid{ grid-template-columns:1fr 1fr } }
.statement__body{ color:var(--ice-dim); max-width:52ch; margin:0 }

/* ============================== ABOUT ================================== */
.about__grid{ display:grid; gap:clamp(2.5rem,6vw,6rem); grid-template-columns:1fr }
@media (width >= 950px){ .about__grid{ grid-template-columns:5fr 6fr } }
.about__meta{ display:grid; gap:1.2rem; align-content:start }
.figures{
  display:grid; grid-template-columns:1fr; margin-top:clamp(2.5rem,7vh,4.5rem);
  border-top:1px solid var(--hairline);
}
@media (width >= 700px){ .figures{ grid-template-columns:repeat(3,1fr) } }
.figure{ padding:clamp(1.4rem,3.5vh,2.2rem) 0; border-bottom:1px solid var(--hairline) }
@media (width >= 700px){
  .figure{ padding-inline:clamp(1rem,2.5vw,2rem) 1rem; border-left:1px solid var(--hairline) }
  .figure:first-child{ border-left:0; padding-left:0 }
}
.figure__v{
  font-family:var(--display); font-weight:300; font-size:var(--step-2);
  line-height:1; color:var(--ice); margin:0 0 .6rem; display:block;
}
.figure__k{ display:block }

/* ============================ 03 — PRODUCTS ============================ */
/* A premium catalogue, not a grid of cards: one species at a time, the
   photograph carrying most of the viewport. */
.products__head{ display:grid; gap:1.3rem; margin-bottom:clamp(3rem,9vh,6rem) }
.products__head .lead{ max-width:46ch }
.product{
  border-top:1px solid var(--hairline);
  padding-block:clamp(3rem,9vh,7rem);
  display:grid; gap:clamp(1.8rem,4vw,4.5rem); grid-template-columns:1fr;
  align-items:center;
}
@media (width >= 950px){
  .product{ grid-template-columns:1fr 1fr; gap:clamp(3rem,6vw,7rem) }
  .product:nth-child(even) .product__media{ order:2 }
}
.product__media{
  /* width:100% is not decoration: with only aspect-ratio and a min-height, a
     narrow column lets the height drive the width — at 390px the frame came
     out 419px wide and pushed the whole page sideways. Pinning the width
     makes the ratio a floor for the height instead. */
  position:relative; width:100%; overflow:hidden; background:var(--navy);
  aspect-ratio:4/5; min-height:clamp(320px, 62svh, 760px);
}
.product__media > img{ width:100%; height:100%; object-fit:cover }
.product__num{ display:flex; align-items:baseline; gap:1rem; margin-bottom:1.4rem }
.product__name{
  font-family:var(--display); font-weight:300; font-size:var(--step-3);
  line-height:.94; text-transform:uppercase; letter-spacing:-.005em;
  margin:0 0 .8rem; color:var(--ice);
}
.product__trade{ font-size:var(--step-1); color:var(--fog); margin:0 }
.product__bino{ font-family:var(--display); font-style:italic; font-size:var(--step-0); color:var(--accent); margin:.4rem 0 0 }
.product__note{ color:var(--ice-dim); margin:1.6rem 0 0; max-width:44ch }
.product__cta{
  display:inline-flex; align-items:center; gap:.85rem; margin-top:2.2rem;
  font-family:var(--sans); font-weight:500; font-size:var(--step--2);
  letter-spacing:.2em; text-transform:uppercase; color:var(--ice);
  border-bottom:1px solid var(--hairline); padding-bottom:.5rem;
  transition:border-color .35s var(--ease), color .35s var(--ease);
}
.product__cta:hover{ border-bottom-color:var(--accent); color:var(--accent) }
.product__cta i{ font-style:normal; transition:transform .35s var(--ease) }
.product__cta:hover i{ transform:translateX(6px) }

/* ========================= 04 — CINEMATIC FILM ========================= */
/* A scene, not a banner: full-bleed, no player chrome, no card. */
.film{
  position:relative; min-height:clamp(520px, 88svh, 1100px);
  display:grid; align-content:end; overflow:hidden; background:var(--abyss);
}
.film__media{ position:absolute; inset:0; z-index:0 }
.film__media > img, .film__media > video{ width:100%; height:100%; object-fit:cover }
.film__media .ph{ border:0; place-content:start center; padding-top:clamp(5rem,13vh,9rem) }
.film__scrim{ position:absolute; inset:0; z-index:1; background:var(--scrim-film); pointer-events:none }
.film__in{ position:relative; z-index:3; padding-block:clamp(3rem,10vh,6rem) }
.film__line{
  font-family:var(--display); font-weight:300; font-size:var(--step-3);
  line-height:1.02; color:var(--ice); margin:1.6rem 0 0; max-width:18ch;
}
.film__note{ margin-top:1.6rem }

/* ============================= 05 — QUALITY ============================ */
/* Four movements, numbered. Each keeps a media slot in reserve. */
.quals{
  display:grid; grid-template-columns:1fr; gap:0;
  border-top:1px solid var(--hairline); margin-top:clamp(1rem,4vh,2rem);
}
@media (width >= 800px){ .quals{ grid-template-columns:1fr 1fr } }
.qual{
  padding:clamp(2rem,5vh,3.4rem) 0; border-bottom:1px solid var(--hairline);
  display:grid; gap:.9rem; align-content:start;
}
@media (width >= 800px){
  .qual{ padding-inline:clamp(1.5rem,3vw,3rem) clamp(1.5rem,3vw,3rem); border-left:1px solid var(--hairline) }
  .qual:nth-child(odd){ border-left:0; padding-left:0 }
}
.qual__n{
  font-family:var(--display); font-weight:300; font-size:var(--step-2);
  line-height:1; color:var(--accent); margin:0; font-variant-numeric:tabular-nums;
}
.qual__t{
  font-family:var(--display); font-weight:400; font-size:var(--step-1);
  line-height:1.1; text-transform:uppercase; letter-spacing:.01em;
  color:var(--ice); margin:.5rem 0 0;
}
.qual__b{ color:var(--fog); margin:0; max-width:44ch }
.qual__media{ margin-top:1.4rem; aspect-ratio:16/10; position:relative; overflow:hidden }

/* ============================= 06 — PROCESS ============================ */
/* An industrial narrative told with a rule, numbers and type. */
.chain{ position:relative; margin-top:clamp(2rem,6vh,4rem); padding-left:clamp(2.2rem,6vw,5rem) }
.chain::before{
  content:""; position:absolute; left:clamp(.55rem,1.6vw,1.3rem); top:.9rem; bottom:.9rem;
  width:1px; background:linear-gradient(180deg,
    rgba(169,195,212,0), var(--hairline) 12%, var(--hairline) 88%, rgba(169,195,212,0));
}
.link{
  position:relative; padding-block:clamp(1.5rem,4vh,2.6rem);
  display:grid; gap:.5rem 2.5rem; grid-template-columns:1fr; align-items:baseline;
}
.link + .link{ border-top:1px solid var(--hairline-2) }
@media (width >= 860px){ .link{ grid-template-columns:5rem 18rem 1fr } }
.link::before{
  content:""; position:absolute; left:calc(clamp(2.2rem,6vw,5rem) * -1 + clamp(.25rem,1.35vw,1rem));
  top:calc(clamp(1.5rem,4vh,2.6rem) + .42em); width:7px; height:7px;
  background:var(--accent); border-radius:50%;
}
.link__t{
  font-family:var(--display); font-weight:400; font-size:var(--step-1);
  line-height:1.08; text-transform:uppercase; letter-spacing:.01em;
  color:var(--ice); margin:0;
}
.link__b{ color:var(--fog); margin:0; grid-column:1 / -1; max-width:52ch }
@media (width >= 860px){ .link__b{ grid-column:3 } }

/* ==================== TRACEABILITY / PAIRED DETAIL ===================== */
.pairs{ display:grid; gap:0; margin-top:clamp(2rem,6vh,4rem) }
.pair{
  display:grid; gap:.5rem 2.5rem; padding-block:clamp(1.3rem,3.2vh,2.1rem);
  border-top:1px solid var(--hairline); grid-template-columns:1fr;
}
@media (width >= 800px){ .pair{ grid-template-columns:1fr 2fr } }
.pair__t{
  margin:0; font-family:var(--display); font-weight:400; font-size:var(--step-1);
  color:var(--ice); text-transform:uppercase; letter-spacing:.01em; line-height:1.1;
}
.pair__b{ margin:0; color:var(--fog); max-width:52ch }

/* ========================== 07 — GLOBAL REACH ========================== */
.reach__grid{ display:grid; gap:clamp(2.5rem,5vw,5rem); grid-template-columns:1fr; align-items:start }
@media (width >= 950px){ .reach__grid{ grid-template-columns:5fr 7fr } }
.reach__map{
  position:relative; aspect-ratio:16/10; border:1px solid var(--hairline);
  background:linear-gradient(180deg, rgba(23,56,79,.22), rgba(4,7,11,0));

}
.reach__list{ list-style:none; margin:0; padding:0; display:grid }
.reach__list li{
  border-top:1px solid var(--hairline); padding-block:1.05rem;
  display:flex; justify-content:space-between; align-items:baseline; gap:1rem;
  font-size:var(--step--1); color:var(--fog);
}
.reach__list li > span:first-child{ letter-spacing:.16em; text-transform:uppercase; font-weight:500; font-size:var(--step--2) }
.reach__list li b{ color:var(--ice); font-weight:400 }

/* ======================== 08 — B2B POSITIONING ========================= */
.partners{ display:grid; grid-template-columns:1fr; gap:0; margin-top:clamp(2rem,6vh,4rem) }
@media (width >= 720px){ .partners{ grid-template-columns:repeat(2,1fr) } }
@media (width >= 1150px){ .partners{ grid-template-columns:repeat(4,1fr) } }
.partner{
  padding:clamp(1.8rem,4.5vh,2.8rem) 0; border-top:1px solid var(--hairline);
  display:grid; gap:.8rem; align-content:start;
}
@media (width >= 720px){
  .partner{ padding-inline:clamp(1.4rem,2.6vw,2.4rem) clamp(1.4rem,2.6vw,2.4rem);
            border-left:1px solid var(--hairline) }
  .partner:nth-child(2n+1){ border-left:0; padding-left:0 }
}
@media (width >= 1150px){
  .partner:nth-child(2n+1){ border-left:1px solid var(--hairline); padding-left:clamp(1.4rem,2.6vw,2.4rem) }
  .partner:first-child{ border-left:0; padding-left:0 }
}
.partner__t{
  font-family:var(--display); font-weight:400; font-size:var(--step-1);
  line-height:1.1; text-transform:uppercase; letter-spacing:.01em;
  color:var(--ice); margin:0;
}
.partner__b{ color:var(--fog); margin:0 }

/* =============================== FINAL ================================= */
.final{
  position:relative; min-height:clamp(460px,76svh,900px); display:grid;
  align-content:center; overflow:hidden; text-align:center;
  background:linear-gradient(180deg, var(--abyss), var(--deep) 52%, var(--abyss));
}
.final__line{
  font-family:var(--display); font-weight:300; font-size:var(--step-4);
  line-height:1; text-transform:uppercase; letter-spacing:-.01em;
  margin:0 auto; color:var(--ice); max-width:16ch;
}
/* Bound to a class, not to `span`: a module that wraps the words to animate
   them would otherwise inherit this tint and flatten the two-tone line. */
.final__line .final__lead{ color:var(--fog) }

/* ============================== CONTACT ================================ */
.contact__grid{ display:grid; gap:clamp(2.5rem,5vw,5rem); grid-template-columns:1fr }
@media (width >= 950px){ .contact__grid{ grid-template-columns:6fr 5fr } }
.form{ display:grid; gap:1.6rem }
.form__row{ display:grid; gap:1.6rem; grid-template-columns:1fr }
@media (width >= 620px){ .form__row{ grid-template-columns:1fr 1fr } }
.field{ display:grid; gap:.5rem }
.field label{
  font-family:var(--sans); font-weight:500; font-size:var(--step--2);
  letter-spacing:.2em; text-transform:uppercase; color:var(--fog);
}
.field input, .field select, .field textarea{
  background:transparent; border:0; border-bottom:1px solid var(--hairline);
  padding:.7rem 0; color:var(--ice); font-size:var(--step-0);
  transition:border-color .35s var(--ease);
}
.field textarea{ resize:vertical; min-height:7rem }
.field select{ cursor:pointer }
.field select option{ background:var(--navy); color:var(--ice) }
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-bottom-color:var(--accent);
}
.submit{
  justify-self:start; margin-top:.8rem; cursor:pointer;
  background:var(--ice); color:var(--abyss); border:1px solid var(--ice);
  padding:1rem 2.4rem; font-family:var(--sans); font-weight:500;
  font-size:var(--step--2); letter-spacing:.22em; text-transform:uppercase;
  transition:background .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease);
}
.submit:hover{ background:transparent; color:var(--ice); border-color:var(--accent) }
.direct{ display:grid; align-content:start; gap:0 }
.direct__row{
  border-top:1px solid var(--hairline); padding-block:1.05rem;
  display:flex; justify-content:space-between; gap:1.2rem; align-items:baseline;
}
.direct__k{
  font-size:var(--step--2); letter-spacing:.2em; text-transform:uppercase;
  color:var(--fog); white-space:nowrap; font-weight:500;
}
.direct__v{ text-align:right; font-size:var(--step--1) }
.direct__v a{ border-bottom:1px solid var(--hairline) }
.direct__v a:hover{ border-bottom-color:var(--accent) }

/* =============================== FOOTER ================================ */
.foot{ background:var(--deep); padding-block:clamp(4rem,10vh,7rem) }
.foot__grid{ display:grid; gap:3rem; grid-template-columns:1fr }
@media (width >= 850px){ .foot__grid{ grid-template-columns:2fr 1fr 1fr } }
.foot__brand{
  font-family:var(--sans); font-weight:500; letter-spacing:.42em;
  text-transform:uppercase; font-size:var(--step--1); margin:0 0 1.4rem;
  padding-right:.42em;
}
.foot__tag{
  font-family:var(--display); font-weight:300; font-size:var(--step-2);
  text-transform:uppercase; line-height:1.06; margin:0; color:var(--fog); max-width:18ch;
}
.foot__tag b{ color:var(--ice); font-weight:300 }
.foot__addr{ margin:2rem 0 0; color:var(--fog); font-size:var(--step--1); max-width:34ch; font-style:normal; line-height:1.7 }
.foot__col h3{
  font-family:var(--sans); font-size:var(--step--2); letter-spacing:.22em;
  text-transform:uppercase; color:var(--fog); margin:0 0 1.2rem; font-weight:500;
}
.foot__col ul{ list-style:none; margin:0; padding:0; display:grid; gap:.6rem }
.foot__col a{ font-size:var(--step--1); color:var(--ice-dim); transition:color .3s }
.foot__col a:hover{ color:var(--ice) }
.foot__base{
  margin-top:clamp(3rem,7vh,5rem); padding-top:1.6rem; border-top:1px solid var(--hairline);
  display:flex; flex-wrap:wrap; gap:.8rem 1.5rem; justify-content:space-between;
  font-size:var(--step--2); letter-spacing:.12em; color:var(--fog);
}

/* ========================= ANIMATION SLOTS ============================= */
/* A slot never holds content the page depends on. It is an empty, sized
   stage layered behind its section's static content. A module registers into
   it later; with none registered, nothing renders and the section is intact. */
.slot{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden }
.slot canvas, .slot video, .slot svg, .slot iframe{ width:100%; height:100%; object-fit:cover; display:block }
[data-anim-slot]{ position:relative }
[data-anim-slot] > .shell,
[data-anim-slot] > .shell--narrow,
[data-anim-slot] > .hero__in,
[data-anim-slot] > .hero__foot,
[data-anim-slot] > .statement__in,
[data-anim-slot] > .film__in{ position:relative; z-index:2 }
/* In the two full-bleed frames the stage sits above the scrim, so a module
   draws into the picture rather than under the dimming layer. */
.hero > .slot, .film > .slot{ z-index:2 }
/* The hero's media layer is itself a stage, so it carries data-anim-slot and
   would otherwise pick up the position:relative above; it has to stay
   absolute. Its stage sits over the waiting-placeholder and under the scrim,
   which is where footage would be. */
.hero__media[data-anim-slot]{ position:absolute }
.hero__media > .slot{ z-index:1 }
/* A stage slot occupies nothing until a module mounts, so the page has no
   empty gaps with none of them integrated. */
.anim-stage{ height:0; overflow:hidden; position:relative }
.anim-stage.is-live{ height:clamp(46svh, 60svh, 70svh); margin-block:clamp(2.5rem,7vh,5rem) }

/* ============================ PRODUCT PAGE ============================= */
.phero{
  position:relative; min-height:70svh; display:grid; align-content:end;
  padding-block:10rem var(--band); overflow:hidden;
  background:linear-gradient(180deg, var(--deep) 0%, var(--abyss) 100%);
}
.phero::after{ content:""; position:absolute; inset:0; background:var(--wash); pointer-events:none }
.phero > .shell{ position:relative; z-index:2 }
.phero__name{
  font-family:var(--display); font-weight:300; font-size:var(--step-4);
  line-height:.9; text-transform:uppercase; letter-spacing:-.01em; margin:.8rem 0 0;
}
.pgrid{ display:grid; gap:clamp(2rem,5vw,4.5rem); grid-template-columns:1fr }
@media (width >= 900px){ .pgrid{ grid-template-columns:1fr 1fr } }
.spec{ display:grid; margin-top:clamp(1.6rem,4vh,2.6rem) }
.spec__row{
  border-top:1px solid var(--hairline); padding-block:.95rem;
  display:flex; justify-content:space-between; gap:1.2rem; align-items:baseline;
}
.spec__k{
  font-size:var(--step--2); letter-spacing:.2em; text-transform:uppercase;
  color:var(--fog); white-space:nowrap; font-weight:500;
}
.spec__v{ text-align:right; font-size:var(--step--1) }
.editable{
  font-family:var(--mono); font-size:var(--step--1); color:var(--accent);
  border-bottom:1px dashed rgba(169,195,212,.4);
}
.gallery{
  display:grid; gap:1px; background:var(--hairline);
  margin-top:clamp(1.6rem,4vh,2.6rem); grid-template-columns:repeat(2,1fr);
}
@media (width >= 780px){ .gallery{ grid-template-columns:repeat(4,1fr) } }
.gallery div{ aspect-ratio:4/5; background:var(--navy); display:grid; place-content:center; position:relative }

/* ============================== MOTION ================================= */
/* Reveals are opt-in from script, so with JS off nothing is stranded.
   Everything below is a hook for the cinematic layer that comes later. */
.js-rise{
  opacity:0; transform:translateY(26px);
  transition:opacity .9s var(--ease), transform .9s var(--ease);
}
.js-rise.is-in{ opacity:1; transform:none }
.js-rise[data-delay="1"]{ transition-delay:.09s }
.js-rise[data-delay="2"]{ transition-delay:.18s }
.js-rise[data-delay="3"]{ transition-delay:.27s }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important }
  .js-rise{ opacity:1 !important; transform:none !important }
  html{ scroll-behavior:auto }
}
@media (prefers-reduced-motion: no-preference){ html{ scroll-behavior:smooth } }

.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* ===========================================================================
   THE CONVERSION LAYER
   Added for the short edition. Two actions in the first frame, a contact
   button that never leaves the screen, and the species index that replaced
   seven full-viewport frames.
   =========================================================================== */

/* --- buttons --------------------------------------------------------------
   One shape, two weights. Not a SaaS pill: a rectangle with a hairline, the
   same geometry as the rules that run through the rest of the page. */
.btn{
  display:inline-flex; align-items:center; gap:.7rem;
  padding:1.05rem 1.9rem; border:1px solid var(--accent);
  font-family:var(--sans); font-size:.82rem; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; text-decoration:none;
  transition:background .4s var(--ease), color .4s var(--ease),
             border-color .4s var(--ease);
}
.btn--solid{ background:var(--accent); color:var(--abyss); border-color:var(--accent) }
.btn--solid:hover{ background:var(--ice); border-color:var(--ice); color:var(--abyss) }
.btn--ghost{ background:transparent; color:var(--ice); border-color:rgba(241,244,246,.32) }
.btn--ghost:hover{ border-color:var(--accent); color:var(--accent) }

.hero__acts{ display:flex; flex-wrap:wrap; gap:.9rem; margin-top:clamp(2rem,4.5vh,3.2rem) }
@media (width < 520px){
  .hero__acts{ gap:.7rem }
  .hero__acts .btn{ flex:1 1 100%; justify-content:center; padding:1rem 1.2rem }
}

/* --- the contact button in the nav ---------------------------------------
   It stays at every width, including under 1024px where the link list
   collapses into the menu. That is the whole point of it. */
.nav__cta{
  display:inline-flex; align-items:center;
  padding:.62rem 1.15rem; border:1px solid var(--accent); color:var(--accent);
  font-family:var(--sans); font-size:.68rem; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase; text-decoration:none;
  white-space:nowrap;
  transition:background .35s var(--ease), color .35s var(--ease);
}
.nav__cta:hover{ background:var(--accent); color:var(--abyss) }
@media (width < 420px){ .nav__cta{ padding:.55rem .8rem; font-size:.62rem; letter-spacing:.1em } }

/* --- the species index ----------------------------------------------------
   Seven rows where there were seven viewports. Typography and a rule, which
   is the same instrument the process chain uses — no new visual language. */
.index__kicker{ margin:clamp(3.5rem,7vh,5.5rem) 0 1.6rem }
.index{ position:relative }
.index__list{ list-style:none; margin:0; padding:0; border-top:1px solid var(--hairline) }
.index__row{ border-bottom:1px solid var(--hairline) }
.index__link{
  /* Four columns, not three: the binomial and the arrow were both landing in
     column 3, so the arrow wrapped to a second row and doubled the height of
     every row in the index. */
  display:grid; grid-template-columns:3.4rem 1fr auto 2rem; align-items:baseline;
  gap:.35rem 1.4rem; padding:1.35rem 0; text-decoration:none; color:inherit;
  transition:padding-left .5s var(--ease);
}
.index__link:hover{ padding-left:.9rem }
.index__n{ color:var(--accent) }
.index__t{ display:flex; flex-wrap:wrap; align-items:baseline; gap:.35rem .9rem }
.index__name{
  font-family:var(--display); font-size:clamp(1.35rem,.9rem+1.1vw,2.1rem);
  line-height:1.05; color:var(--ice);
  transition:color .4s var(--ease);
}
.index__link:hover .index__name{ color:var(--accent) }
.index__trade{ font-family:var(--sans); font-size:.9rem; color:var(--fog) }
.index__bino{ font-family:var(--mono); font-size:.74rem; color:var(--fog); font-style:italic }
.index__bino{ grid-column:3; text-align:right }
.index__go{
  grid-column:4; justify-self:end; font-style:normal; color:var(--accent);
  transition:transform .4s var(--ease);
}
.index__link:hover .index__go{ transform:translateX(8px) }
@media (width < 700px){
  .index__link{ grid-template-columns:2.6rem 1fr 1.6rem; gap:.25rem .9rem; padding:1.1rem 0 }
  .index__bino{ grid-column:2; grid-row:2; text-align:left }
  .index__go{ grid-column:3; grid-row:1 }
}

/* --- CONTROL: three movements under one heading --------------------------- */
.sub{ margin-top:clamp(3.5rem,8vh,6rem) }
.sub > .tag{ margin-bottom:2rem }

/* --- the process chain, compacted ----------------------------------------
   Eight stages stacked one under another was 1.4 screens on a phone for what
   is, in the end, a sequence. Laid out as a grid it reads as a sequence at a
   glance — which is what a chain is for — and every stage keeps its
   description. The vertical rule becomes the top rule of each cell. */
.chain--grid{ padding-left:0; display:grid; gap:0 clamp(1.5rem,3vw,3rem) }
.chain--grid::before{ display:none }
.chain--grid .link{
  padding-block:clamp(1.1rem,2.6vh,1.7rem);
  border-top:1px solid var(--hairline); grid-template-columns:1fr;
  gap:.35rem;
}
.chain--grid .link + .link{ border-top:1px solid var(--hairline) }
.chain--grid .link::before{
  left:0; top:calc(clamp(1.1rem,2.6vh,1.7rem) * -1 - 3px);
  width:100%; height:1px; background:var(--accent); border-radius:0;
  transform:scaleX(0); transform-origin:left center;
  transition:transform .8s var(--ease);
}
.chain--grid .link.is-in::before{ transform:scaleX(.16) }
.chain--grid .link__t{ font-size:clamp(1.05rem,.85rem+.5vw,1.4rem) }
.chain--grid .link__b{ grid-column:1; font-size:.86rem; max-width:34ch }
@media (width >= 400px){ .chain--grid{ grid-template-columns:repeat(2,1fr) } }
@media (width >= 1000px){ .chain--grid{ grid-template-columns:repeat(4,1fr) } }

/* traceability: four records, two columns, no full-width rows */
@media (width >= 700px){ .pairs--grid{ grid-template-columns:repeat(2,1fr); gap:0 clamp(1.5rem,3vw,3rem) } }

/* On a phone the chain stays one column — two would wrap "Control de calidad"
   into three lines and read worse than it saves. Tighter instead: the body
   drops to caption size and the row loses its outer padding. Nothing is
   hidden; a stage a buyer cares about is still on the page. */
@media (width < 620px){
  .chain--grid .link{ padding-block:.85rem }
  .chain--grid .link__t{ font-size:1.02rem }
  .chain--grid .link__b{ font-size:.8rem; line-height:1.5; max-width:none }
}

/* ===================== BETWEEN PAGES, AND BETWEEN LANGUAGES ===============
   Two moments where the site used to cut hard: clicking a species in the
   index, and switching language. Both are the same gesture underneath — the
   page changes but the subject does not — so both get a transition instead of
   a flash. Progressive by construction: a browser without view transitions
   navigates and re-renders exactly as before, and nothing here is required
   for the page to work. */
@view-transition{ navigation:auto }

/* The whole page crosses over quickly. Long enough to read as continuity,
   short enough that nobody waits for it: a buyer clicking a species wants the
   species, not the animation. */
::view-transition-old(root),
::view-transition-new(root){ animation-duration:.26s; animation-timing-function:var(--ease) }

/* The species name and its number travel. They are the one thing genuinely
   shared by the two pages, so they move rather than fade — the index row
   becomes the hero. Names are assigned in JS, on the row actually clicked,
   because a name must be unique on the page: tagging all seven rows up front
   would leave six orphans animating on their own. */
::view-transition-group(sp-title),
::view-transition-group(sp-num){ animation-duration:.5s; animation-timing-function:var(--ease) }
::view-transition-old(sp-title),
::view-transition-new(sp-title),
::view-transition-old(sp-num),
::view-transition-new(sp-num){ animation-duration:.32s; mix-blend-mode:normal }

/* Reduced motion keeps the continuity and drops the travel: the transition
   resolves in the next frame instead of being cancelled, so the page never
   lands mid-snapshot. */
@media (prefers-reduced-motion: reduce){
  ::view-transition-group(*),
  ::view-transition-old(*),
  ::view-transition-new(*){ animation-duration:.001s !important }
}

<!-- 01 ...................................................... HERO
     Three layers: media, scrim, content. Replace the contents of
     .hero__media with an <img> or a looping <video> and nothing else in
     this file, the stylesheet or the script has to change. -->
<section class="hero" id="hero" data-anim-slot="CinematicIntro">
  <div class="hero__media" data-media="hero" data-anim-slot="HeroField"><div class="ph" aria-hidden="true"></div>
    <div class="slot" aria-hidden="true"></div>
  </div>
  <div class="hero__scrim" aria-hidden="true"></div>
  <div class="slot" aria-hidden="true"></div>
  <div class="hero__in">
    <div class="shell">
      <p class="hero__eyebrow coord"><i></i><span id="hero-eyebrow"></span></p>
      <h1 class="hero__brand">INSIDUS</h1>
      <p class="hero__claim" id="hero-claim"></p>
      <!-- The proposition is one click from the first frame, not nineteen
           screens down. Both actions are in the markup from the start: the
           intro animation decorates around them, it never gates them. -->
      <div class="hero__acts">
        <a class="btn btn--solid" id="hero-cta" href="#contact"></a>
        <a class="btn btn--ghost" id="hero-alt" href="#products"></a>
      </div>
    </div>
  </div>
  <div class="hero__foot">
    <div class="shell" style="display:flex;justify-content:space-between;align-items:center;gap:1rem">
      <span class="hero__scroll coord"><i></i><span id="hero-scroll"></span></span>
      <span class="coord">33°35′S · 71°37′W</span>
    </div>
  </div>
</section>

<!-- 02 ........................................................ PRODUCTS
     One species carries the editorial frame; the other seven are an index.
     The full treatment did not disappear — it lives on /products/<slug>/,
     which is where a buyer who is actually interested goes. -->
<section class="band band--deep" id="products">
  <div class="shell">

/* Bundles may be inlined (single-file build) or fetched from /locales.
   CFG.locales moves that origin — a CDN, say — without moving the links,
   which stay on BASE. Either way the components only ever see a resolved
   dictionary. */
var CACHE = W.INSIDUS_LOCALES || {};
var LOCALES = CFG.locales || (BASE + "locales/");
function loadLocale(lang) {
  if (CACHE[lang]) return Promise.resolve(CACHE[lang]);
  return fetch(LOCALES + lang + ".json", { credentials: "same-origin" })
    .then(function (r) {
      if (!r.ok) throw new Error("locale " + lang + " " + r.status);
      return r.json();
    })
    .then(function (d) { CACHE[lang] = d; return d; });
}

/* ----------------------------------------------------------------- SEO -- */
function applySEO(lang, d) {
  var html = document.documentElement;
  html.setAttribute("lang", HTML_LANG[lang] || lang);

  var title, desc;
  if (PAGE === "product") {
    var sp = speciesBySlug(PRODUCT) || {};
    var vars = { name: sp.name, trade: sp.trade, bino: sp.bino };
    title = fmt(d.meta.productTitle, vars);
    desc = fmt(d.meta.productDesc, vars);
  } else {
    title = d.meta.title;
    desc = d.meta.description;
  }
  document.title = title;
  meta("name", "description", desc);
  meta("property", "og:title", title);
  meta("property", "og:description", desc);
  meta("property", "og:locale", (HTML_LANG[lang] || lang).replace("-", "_"));
  meta("property", "og:type", "website");
  meta("name", "twitter:card", "summary_large_image");

  // hreflang set, regenerated so the alternates always match the current path
  $$("link[data-hreflang]").forEach(function (n) { n.remove(); });
  var head = document.head;
  var path = location.pathname;
  LANGS.forEach(function (l) {
    var link = document.createElement("link");
    link.rel = "alternate";
    link.setAttribute("hreflang", HTML_LANG[l] || l);
    link.href = location.origin + path + "?lang=" + l;
    link.setAttribute("data-hreflang", "");
    head.appendChild(link);
  });
  var x = document.createElement("link");
  x.rel = "alternate"; x.setAttribute("hreflang", "x-default");
  x.href = location.origin + path;
  x.setAttribute("data-hreflang", "");
  head.appendChild(x);
}
function meta(attr, key, val) {
  var n = document.head.querySelector("meta[" + attr + '="' + key + '"]');
  if (!n) { n = document.createElement("meta"); n.setAttribute(attr, key); document.head.appendChild(n); }
  n.setAttribute("content", val);
}

function speciesBySlug(slug) {
  for (var i = 0; i < SPECIES.length; i++) if (SPECIES[i].slug === slug) return SPECIES[i];
  return null;
}

/* ============================ COMPONENTS ================================ */
/* Each takes the resolved dictionary; none holds copy of its own. */

function Navbar(d) {
  var host = clear("#nav-links");
  if (host) {
    navItems(d).forEach(function (it) {
      var li = el("li"), a = el("a", null, it.label);
      a.href = it.href; li.appendChild(a); host.appendChild(li);
    });
  }
  var mob = clear("#menu-list");
  if (mob) {
    var root = PAGE === "product" ? BASE : "";
    navItems(d).concat([{ label: d.nav.contact, href: root + "#contact" }])
      .forEach(function (it, i) {
        var li = el("li"), a = el("a");
        a.href = it.href;
        a.appendChild(el("span", "num", String(i + 1).padStart(2, "0")));
        a.appendChild(el("span", null, it.label));
        li.appendChild(a); mob.appendChild(li);
      });
  }
  setText("#menu-open", d.nav.menu);
  setText("#menu-close", d.nav.close);
  var cta = $("#nav-cta");
  if (cta) {
    cta.textContent = d.nav.contact;
    if (PAGE === "product") cta.href = BASE + "#contact";
  }
}
/* Four destinations, not six. Process folded into quality, and contact left
   the list entirely — it is the button, always on screen. */
function navItems(d) {
  var root = PAGE === "product" ? BASE : "";
  return [
    { label: d.nav.products, href: root + "#products" },
    { label: d.nav.about,    href: root + "#about" },
    { label: d.nav.quality,  href: root + "#quality" },
    { label: d.nav.global,   href: root + "#global" }
  ];
}

function LanguageSwitcher(lang, d) {
  var btn = $("#lang-btn"), menu = clear("#lang-menu");
  if (btn) { btn.textContent = LABEL[lang] || lang; btn.setAttribute("aria-label", d.ui.langLabel); }
  if (!menu) return;
  LANGS.forEach(function (l) {
    var a = el("a");
    a.href = "?lang=" + l;
    a.setAttribute("data-lang", l);
    if (l === lang) a.setAttribute("aria-current", "true");
    a.appendChild(el("span", null, LABEL[l] || l));
    a.appendChild(el("span", "mono", l.toUpperCase()));
    menu.appendChild(a);
  });
}

/* One species carries the editorial frame; the rest are an index that links
   to the detail pages, where the full treatment already lives. Eight full
   viewports of photography was 42% of the page and none of it exists yet. */
function ProductShowcase(d) {
  setText("#products-kicker", d.products.kicker);
  setText("#products-title", d.products.title);
  setText("#products-lead", d.products.lead);

  var feat = clear("#products-featured");
  if (feat && SPECIES.length) feat.appendChild(productCard(d, SPECIES[0], true));

  var list = clear("#products-index-list");
  if (!list) return;
  setText("#products-index-kicker", d.ui.indexKicker);
  SPECIES.slice(1).forEach(function (s) {
    var li = el("li", "index__row js-rise");
    var a = el("a", "index__link");

    a.setAttribute("data-slug", s.slug);
    a.appendChild(el("span", "num index__n", s.n));

    t.appendChild(el("span", "index__name", s.name));
    t.appendChild(el("span", "index__trade", s.trade));
    a.appendChild(t);
    a.appendChild(el("span", "index__bino", s.bino));
    a.appendChild(el("i", "index__go", "\u2192"));
    li.appendChild(a);
    list.appendChild(li);
  });

/* The frame keeps its size whether or not the photograph exists, so dropping
   artwork into PRODUCT_MEDIA never moves the layout. */
function productCard(d, s, featured) {
  var art = el("article", "product js-rise");
  var media = el("div", "product__media");
  var shot = (CFG.productMedia || {})[s.slug];
  if (shot) {
    var img = el("img");
    img.src = shot;
    img.alt = s.name + " \u2014 " + s.trade;
    img.loading = "lazy"; img.decoding = "async";
    media.appendChild(img);
  } else {
    media.appendChild(photoSlot(d, s.slug + ".jpg", "1600 \u00d7 2000",
                                (CFG.thumbs || {})[s.slug], d.ui.reference));
  }

  var info = el("div");
  var head = el("div", "product__num");
  head.appendChild(el("span", "num", s.n));
  head.appendChild(el("span", "tag", featured ? d.ui.featured : d.products.index));
  info.appendChild(head);
  info.appendChild(el("h3", "product__name", s.name));
  info.appendChild(el("p", "product__trade", s.trade));
  info.appendChild(el("p", "product__bino", s.bino));

  var a = el("a", "product__cta");
  a.href = BASE + "products/" + s.slug + "/" + langQuery();
  a.setAttribute("data-slug", s.slug);
  a.appendChild(el("span", null, d.products.view));
  a.appendChild(el("i", null, "\u2192"));
  info.appendChild(a);

  art.appendChild(media); art.appendChild(info);
  return art;
}

/* A placeholder that says, on the page, exactly which file the frame wants —
   with the low-resolution working copy shown small and labelled, so nobody
   mistakes it for the artwork. */
function photoSlot(d, filename, dims, refSrc, refLabel) {
  var ph = el("div", "ph");
  ph.appendChild(el("span", "ph__k", d.ui.photoSlot));
  ph.appendChild(el("span", "ph__f", filename));
  ph.appendChild(el("span", "ph__d", dims));
  if (refSrc) {
    var t = el("img", "ph__ref");
    t.src = refSrc; t.alt = ""; t.loading = "lazy"; t.decoding = "async";
    ph.appendChild(t);
    ph.appendChild(el("span", "ph__d", refLabel));
  }
  return ph;
}

  sections.forEach(function (p) { setText("#ps-" + p[0], p[1]); });

    [[d.prodfields.species, s.bino, true],
     [d.prodfields.trade, s.trade, false],
     [d.prodfields.area, null, false],
     [d.prodfields.season, null, false],
     [d.prodfields.formats, null, false],
     [d.prodfields.sizes, null, false],

      row.appendChild(el("span", "spec__k", r[0]));

      row.appendChild(v); spec.appendChild(row);
    });

  setText("#p-gallery-note", d.prodfields.galleryNote);

  var nx = clear("#p-next");
  if (nx) {
    var idx = SPECIES.indexOf(s);
    var next = SPECIES[(idx + 1) % SPECIES.length];
    var a = el("a", "product__cta");
    a.href = BASE + "products/" + next.slug + "/" + langQuery();
    a.appendChild(el("span", null, d.ui.next + " · " + next.name));
    a.appendChild(el("i", null, "→"));
    nx.appendChild(a);
  }
}

function langQuery() {
  var l = INSIDUS.lang;
  return (l && l !== LANGS[0]) ? "?lang=" + l : "";
}

/* ============================== RENDER ================================== */
function render(lang, d) {
  INSIDUS.lang = lang;
  INSIDUS.dict = d;
  applySEO(lang, d);
  Navbar(d);
  LanguageSwitcher(lang, d);
  Footer(d);
  ContactForm(d);
  if (PAGE === "home") {
    Hero(d);
    Statement(d);
    AboutSection(d);
    Figures(d);
    ProductShowcase(d);
    Film(d);
    Quality(d);
    ProcessTimeline(d);
    PairsSection("trace", d.trace);
    GlobalReach(d);
    Partners(d);
    FinalMoment(d);
  } else if (PAGE === "product") {
    ProductDetail(d);
  }
  markRises();
  INSIDUS.anim._mountAll();
  document.dispatchEvent(new CustomEvent("insidus:rendered", { detail: { lang: lang, dict: d } }));
}

/* Nine languages, and switching one used to repaint the whole page in a
   single frame — every heading, every label, every row swapped at once. The
   content is the same content; only the words change, so it crosses over.
   The API does the work where it exists and the plain call runs everywhere
   else, which means this is a one-line difference, not a code path. */
function swap(apply) {
  if (REDUCE || typeof document.startViewTransition !== "function") return apply();
  try { document.startViewTransition(apply); } catch (e) { apply(); }
}

function setLang(lang, push) {
  if (LANGS.indexOf(lang) < 0) return;
  try { localStorage.setItem(STORE, lang); } catch (e) {}
  if (push) {
    try {
      var u = new URL(location.href);
      u.searchParams.set("lang", lang);
      history.replaceState(null, "", u.pathname + u.search + u.hash);
    } catch (e) {}
  }
  loadLocale(lang).then(function (d) { swap(function () { render(lang, d); }); })
    .catch(function (err) { console.error("[insidus]", err); });
}
INSIDUS.setLang = setLang;

/* ====================== ANIMATION SLOT REGISTRY ========================= */
/* Modules register by name and receive their stage element. Nothing here
   renders content; if no module ever registers, the site is unchanged. */
INSIDUS.anim = (function () {
  var mods = {}, mounted = {};
  return {
    register: function (name, mount) {
      mods[name] = mount;
      this._mount(name);
      return this;
    },
    /* Direct child, not descendant: a slot may sit inside another slot's
       section (the hero holds one for its media layer), and a descendant
       lookup would hand the outer module the inner stage. */
    slot: function (name) { return $('[data-anim-slot="' + name + '"] > .slot'); },
    section: function (name) { return $('[data-anim-slot="' + name + '"]'); },
    _mount: function (name) {
      if (mounted[name] || !mods[name]) return;
      var stage = this.slot(name);
      if (!stage) return;
      mounted[name] = true;
      var host = this.section(name);
      var stageKind = host && host.classList.contains("anim-stage");
      if (stageKind) host.classList.add("is-live");
      try {
        mods[name]({ stage: stage, section: this.section(name),
                     reduce: REDUCE, lang: INSIDUS.lang, dict: INSIDUS.dict });
      } catch (e) { mounted[name] = false; console.error("[insidus.anim]", name, e); }
      /* A stage earns its height by being used. A module may register for a
         slot and enhance the section around it instead of drawing into the
         stage; without this it would leave a 60svh hole in the page. */
      if (stageKind && !stage.children.length) host.classList.remove("is-live");
    },
    _mountAll: function () { for (var k in mods) this._mount(k); },
    names: function () { return $$("[data-anim-slot]").map(function (n) { return n.getAttribute("data-anim-slot"); }); }
  };
})();

/* ============================== CHROME ================================== */
function chrome() {
  // nav turns solid once the opening frame is behind us
  var nav = $("#nav"), opening = $("#hero") || $("#phero");
  var queued = false;
  function paint() {
    queued = false;
    var past = opening ? (opening.getBoundingClientRect().bottom <= 90) : (scrollY > 90);
    if (nav) nav.classList.toggle("is-solid", past);
  }
  addEventListener("scroll", function () {
    if (!queued) { queued = true; requestAnimationFrame(paint); }
  }, { passive: true });
  addEventListener("resize", paint);
  paint();

  // mobile fullscreen menu
  var menu = $("#menu");
  function toggleMenu(open) {
    if (!menu) return;
    menu.classList.toggle("is-open", open);
    document.body.style.overflow = open ? "hidden" : "";
    var t = $("#menu-open"); if (t) t.setAttribute("aria-expanded", open ? "true" : "false");
  }
  on("#menu-open", "click", function () { toggleMenu(true); });
  on("#menu-close", "click", function () { toggleMenu(false); });
  if (menu) menu.addEventListener("click", function (e) {
    if (e.target.closest("a")) toggleMenu(false);
  });

  // language dropdown
  var lang = $("#lang");
  on("#lang-btn", "click", function (e) {
    e.stopPropagation();
    if (lang) lang.classList.toggle("is-open");
  });
  document.addEventListener("click", function () { if (lang) lang.classList.remove("is-open"); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (lang) lang.classList.remove("is-open"); toggleMenu(false); }
  });
  document.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-lang]");
    if (!a) return;
    e.preventDefault();
    if (lang) lang.classList.remove("is-open");
    setLang(a.getAttribute("data-lang"), true);
  });

  // contact form → prefilled mail today; a CRM/WhatsApp transport can replace
  // this handler without touching the markup or the copy.
  var form = $("#contact-form");
  if (form) form.addEventListener("submit", function (e) {
    e.preventDefault();
    var d = INSIDUS.dict; if (!d) return;
    var g = function (id) { var n = $("#f-" + id); return n ? n.value.trim() : ""; };
    var lines = [
      d.contact.name + ": " + g("name"),
      d.contact.company + ": " + g("company"),
      d.contact.country + ": " + g("country"),
      d.contact.email + ": " + g("email"),
      d.contact.interest + ": " + (g("interest") || d.contact.any),
      "", g("message")
    ].join("\n");
    var subject = d.contact.title + (g("interest") ? " — " + g("interest") : "");
    location.href = "mailto:" + FACTS.email +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(lines);
  });
}
function on(sel, ev, fn) { var n = $(sel); if (n) n.addEventListener(ev, fn); }

/* reveals: added by script so no-JS leaves nothing at zero opacity */
var riseObs = null;
function markRises() {
  if (REDUCE) return;
  if (!riseObs && "IntersectionObserver" in W) {
    riseObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("is-in"); riseObs.unobserve(e.target); }
      });
    }, { rootMargin: "0px 0px -10% 0px" });
  }
  if (!riseObs) return;
  $$(".js-rise").forEach(function (n) {
    if (!n.hasAttribute("data-observed")) { n.setAttribute("data-observed", ""); riseObs.observe(n); }
  });
}

/* nav current-section marking */
function navSpy() {
  if (!("IntersectionObserver" in W) || PAGE !== "home") return;
  var obs = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      var id = "#" + e.target.id;
      $$("#nav-links a").forEach(function (a) {
        a.setAttribute("aria-current", a.getAttribute("href").slice(-id.length) === id ? "true" : "false");

  ["about", "products", "quality", "process", "global", "contact"].forEach(function (id) {
    var n = document.getElementById(id); if (n) obs.observe(n);
  });
}

chrome();
navSpy();
setLang(pickLang(), false);

})();

<script>
/* ============================================================================
   CinematicIntro — animation module
   Ported from a React/Tailwind/Framer hero to vanilla, re-cut for INSIDUS:
   the palette is the depth ramp, the grid is the one already behind the page,

   ========================================================================= */
(function () {

   what INSIDUS sells until 3.6s — on a page meant to convert, an intro that
   makes the reader wait for the proposition is a cost, not an asset. The
   whole thing now lands inside ~1.1s, and the two actions in the hero are in

  coord:  { at:  60,  step: 22 },
  brand:  { at: 180,  step: 34 },   // per letter
  line:   { at: 420,  step: 30 },   // per word

"0%{opacity:0;transform:translateY(28px) scale(.94);filter:blur(10px)}",
"55%{opacity:.85;transform:translateY(7px) scale(.99);filter:blur(2px)}",
"100%{opacity:1;transform:none;filter:blur(0)}}",
"@keyframes ins-draw{from{stroke-dashoffset:1400;opacity:0}",
"60%{opacity:.5}to{stroke-dashoffset:0;opacity:.28}}",
"@keyframes ins-dot{from{opacity:0;transform:scale(0)}to{opacity:.85;transform:none}}",
"@keyframes ins-drift{",
"0%{transform:translate(0,0);opacity:.10}",
"30%{transform:translate(9px,-22px);opacity:.42}",
"60%{transform:translate(-7px,-46px);opacity:.24}",
"100%{transform:translate(4px,-72px);opacity:0}}",
"@keyframes ins-ripple{from{opacity:.55;transform:translate(-50%,-50%) scale(.2)}",
"to{opacity:0;transform:translate(-50%,-50%) scale(1)}}",
/* split units start hidden only because this module created them */
".ins-u{display:inline-block;opacity:0;will-change:transform,opacity,filter}",
".ins-u.ins-go{animation:ins-word .85s cubic-bezier(.22,.7,.28,1) forwards}",
".ins-w{display:inline-block;white-space:pre}",
".ins-stage{position:absolute;inset:0;overflow:hidden}",
".ins-stage svg{position:absolute;inset:0;width:100%;height:100%}",
".ins-stage .ins-l{stroke:var(--accent);stroke-width:.6;opacity:0;",
"stroke-dasharray:1400;stroke-dashoffset:1400}",
".ins-stage .ins-l.ins-go{animation:ins-draw 2.4s ease-out forwards}",
".ins-stage .ins-d{fill:var(--accent);opacity:0;transform-origin:center}",
".ins-stage .ins-d.ins-go{animation:ins-dot .9s ease-out forwards}",
".ins-mote{position:absolute;width:2px;height:2px;border-radius:50%;",
"background:var(--fog);opacity:0}",
".ins-mote.ins-go{animation:ins-drift linear infinite}",
".ins-light{position:absolute;width:520px;height:520px;border-radius:50%;",
"pointer-events:none;opacity:0;transition:opacity .6s ease;",

"animation:ins-ripple 1.1s cubic-bezier(.2,.7,.3,1) forwards}",
"@media (prefers-reduced-motion:reduce){",
".ins-u{opacity:1!important;animation:none!important;filter:none!important;transform:none!important}",
".ins-stage .ins-l{opacity:.28!important;stroke-dashoffset:0!important;animation:none!important}",
".ins-stage .ins-d{opacity:.85!important;animation:none!important}",

function injectCSS() {
  if (document.getElementById("ins-anim-intro")) return;
  var s = document.createElement("style");
  s.id = "ins-anim-intro";
  s.textContent = CSS;
  document.head.appendChild(s);
}

/* --------------------------------------------------------------- splitting */
/* Walks text nodes and wraps each word — or each letter — without flattening
   the markup, so the <b> that carries the second line keeps its colour. */
function split(root, mode) {
  if (!root || root.hasAttribute("data-split")) return unitsIn(root);
  root.setAttribute("data-split", mode);
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  var texts = [], n;
  while ((n = walker.nextNode())) if (n.nodeValue.trim()) texts.push(n);

  texts.forEach(function (t) {
    var frag = document.createDocumentFragment();
    if (mode === "letter") {
      Array.prototype.forEach.call(t.nodeValue, function (ch) {
        if (ch === " ") { frag.appendChild(document.createTextNode(" ")); return; }
        var u = document.createElement("span");
        u.className = "ins-u"; u.textContent = ch;
        frag.appendChild(u);
      });
    } else {
      t.nodeValue.split(/(\s+)/).forEach(function (piece) {
        if (!piece) return;
        if (/^\s+$/.test(piece)) { frag.appendChild(document.createTextNode(piece)); return; }
        var w = document.createElement("span");
        w.className = "ins-w";
        var u = document.createElement("span");
        u.className = "ins-u"; u.textContent = piece;
        w.appendChild(u); frag.appendChild(w);
      });
    }
    t.parentNode.replaceChild(frag, t);
  });

}

  return root ? Array.prototype.slice.call(root.querySelectorAll(".ins-u")) : [];
}
function unsplit(root) {
  if (!root || !root.hasAttribute("data-split")) return;
  root.removeAttribute("data-split");
}

  units.forEach(function (u, i) {

  });

function backdrop(stage, reduce) {

/* ------------------------------------------------- pointer light + ripple */
function pointer(section, wrap) {
  if (!matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  var light = document.createElement("div");
  light.className = "ins-light";
  wrap.appendChild(light);

  var x = 0, y = 0, queued = false;
  function paint() {

  }
  section.addEventListener("pointermove", function (e) {
    var r = section.getBoundingClientRect();

    if (!queued) { queued = true; requestAnimationFrame(paint); }

  // A ripple, scoped to this section — clicks elsewhere on the site are not ours.
  section.addEventListener("click", function (e) {

    fog:      css(root, "--fog")      || "#8FA6BC",
    accent:   css(root, "--accent") || "#A9C3D4"
  };

  var W = 0, H = 0, R = 0, cx = 0, cy = 0, dpr = 1, stars = [];

    H = Math.max(1, Math.round(r.height));
    cv.width = W * dpr; cv.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.min(W, H) * 0.36;
    cx = W * 0.5; cy = H * 0.5;
    stars = [];
    var n = Math.round(Math.min(70, W / 12));
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() < 0.85 ? 0.7 : 1.2,
        ph: Math.random() * Math.PI * 2,
        sp: 0.6 + Math.random() * 1.8
      });
    }

  /* orthographic projection; z > 0 is the near hemisphere */
  var D = Math.PI / 180;
  function project(lat, lon, spin) {
    var p = lat * D, l = (lon - spin) * D, p0 = TILT * D;
    var cp = Math.cos(p), sp = Math.sin(p), cl = Math.cos(l), sl = Math.sin(l);
    var c0 = Math.cos(p0), s0 = Math.sin(p0);

      z: s0 * sp + c0 * cp * cl

                                     cx, cy, R * 1.05);
    grd.addColorStop(0, COL.pacific);
    grd.addColorStop(0.45, COL.deep);
    grd.addColorStop(1, COL.abyss);
    g.beginPath(); g.arc(cx, cy, R, 0, 6.2832); g.fillStyle = grd; g.fill();

    g.save();

    var rim = g.createRadialGradient(cx - R * 0.62, cy - R * 0.62, R * 0.55,
                                     cx - R * 0.5, cy - R * 0.5, R * 1.35);

    rim.addColorStop(0.72, "rgba(169,195,212,.12)");

        if (pt.z <= 0) { first = true; continue; }

      lon = -180 + i * 30;
      g.beginPath(); first = true;
      for (lat = -85; lat <= 85; lat += 3) {
        pt = project(lat, lon, spin);
        if (pt.z <= 0) { first = true; continue; }
        if (first) { g.moveTo(pt.x, pt.y); first = false; } else g.lineTo(pt.x, pt.y);
      }
      g.strokeStyle = "rgba(147,163,176,.15)";
      g.stroke();
    }
  }

  /* Coastlines, cut at the horizon: a ring is drawn only where z > 0, so the
     far side never bleeds through. Filling each visible run closes it across
     the limb chord, which is where the horizon runs anyway. */
  function land(spin) {
    var i, j, ring, pt, run;
    for (i = 0; i < LAND.length; i++) {

        if (pt.z <= 0) {

            g.strokeStyle = "rgba(147,163,176,.42)"; g.lineWidth = 1; g.stroke();
          }
          run = null;
          continue;
        }
        if (!run) run = [];
        run.push(pt.x, pt.y);
      }
    }

  function arc(a, b, t) {
    if (a.z <= 0.02 || b.z <= 0.02) return;
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    var dx = mx - cx, dy = my - cy;
    var d = Math.hypot(dx, dy) || 1;
    var lift = R * 0.42;
    var qx = mx + (dx / d) * lift, qy = my + (dy / d) * lift;

    g.beginPath();
    g.moveTo(a.x, a.y);
    g.quadraticCurveTo(qx, qy, b.x, b.y);
    g.strokeStyle = "rgba(169,195,212,.34)";
    g.lineWidth = 1;
    g.stroke();

    // a light travelling the arc, so the direction reads
    var u = t % 1;
    var px = (1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * qx + u * u * b.x;
    var py = (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * qy + u * u * b.y;
    g.beginPath(); g.arc(px, py, 2, 0, 6.2832);
    g.fillStyle = COL.accent; g.fill();
  }

  function marker(p, pulse) {
    if (p.z <= 0) return;
    g.beginPath(); g.arc(p.x, p.y, 2.6, 0, 6.2832);
    g.fillStyle = COL.accent; g.fill();

    g.beginPath(); g.arc(p.x, p.y, r, 0, 6.2832);
    g.strokeStyle = "rgba(169,195,212," + (0.5 * (1 - pulse)).toFixed(3) + ")";
    g.lineWidth = 1; g.stroke();

  function starfield(t, still) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      // keep them clear of the sphere, unlike the original where most were clipped
      if (Math.hypot(s.x - cx, s.y - cy) < R + 8) continue;
      var a = still ? 0.35 : 0.18 + 0.42 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
      g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.2832);
      g.fillStyle = "rgba(241,244,246," + a.toFixed(3) + ")";
      g.fill();
    }
  }

  function frame(spin, t, still) {
    g.clearRect(0, 0, W, H);
    starfield(t, still);
    sphere();
    graticule(spin);
    land(spin);
    var o = project(ORIGIN.lat, ORIGIN.lon, spin);
    for (var i = 0; i < TARGETS.length; i++) {
      arc(o, project(TARGETS[i].lat, TARGETS[i].lon, spin), still ? 0.5 : t * 0.22 + i * 0.25);
    }
    marker(o, still ? null : (t * 0.5) % 1);
  }

  /* ------------------------------------------------------------ lifecycle */
  var spin = -60, raf = 0, running = false, t0 = performance.now();

  function loop(now) {
    var t = (now - t0) / 1000;
    spin += SPIN;
    frame(spin, t, false);
    raf = requestAnimationFrame(loop);
  }
  function start() {
    if (running || ctx.reduce) return;
    running = true; raf = requestAnimationFrame(loop);
  }
  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  }

  size();
  frame(spin, 0, true);

  if (ctx.reduce) return;   // one static frame, no loop — as the contract requires

  // Only run while the section is actually on screen.
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (es) {
      es[0].isIntersecting ? start() : stop();
    }, { rootMargin: "120px" }).observe(section);
  } else {
    start();
  }
  document.addEventListener("visibilitychange", function () {
    document.hidden ? stop() : start();
  });

  var rz;
  window.addEventListener("resize", function () {
    clearTimeout(rz);
    rz = setTimeout(function () { size(); if (!running) frame(spin, 0, true); }, 150);
  }, { passive: true });
}

function boot() {
  if (!window.INSIDUS || !window.INSIDUS.anim) return false;
  window.INSIDUS.anim.register("GlobalMap", mount);
  return true;
}
if (!boot()) {
  document.addEventListener("DOMContentLoaded", boot);
  setTimeout(boot, 300);
}
})();

/* ============================================================================
   HeroField — animation module
   Ported from a React/TypeScript WebGL gradient. The fragment shader is kept
   almost verbatim: it is the valuable part, and it is genuinely good — domain
   warped noise, an iterative swirl and a three-colour blend, all on one quad.
   Everything around it was rewritten.

   What it is here: a stand-in for footage that does not exist yet. It fills
   the opening frame with slow, dark water and then gets out of the way — the
   moment a real <img> or <video> lands in MEDIA["hero"], this module refuses
   to mount. It is not decoration layered on top of the film; it is the film's
   placeholder.

   Plasma, Vortex) is exactly the saturated, startup-looking gradient the
   brief rules out, so none of them is used. This is near-black with one
   restrained tide blue, moving at a fifth of the original speed.

   Load AFTER assets/js/insidus.js.

  color2: "#16374E",   /* one blue, and only just */
  color3: "#04070B",

  scale: 0.55,

  distortion: 6,
  swirl: 52,
  swirlIterations: 6,
  softness: 100,
  offset: 0,
  shape: 2,            /* 0 checks · 1 stripes · 2 edge — a horizon, not a tile */

  "in vec4 a_position;\n" +
  "void main() { gl_Position = a_position; }";

var FRAG = "#version 300 es\n\
precision highp float;\n\
uniform float u_time;\n\
uniform float u_pixelRatio;\n\
uniform vec2  u_resolution;\n\
uniform float u_scale;\n\
uniform float u_rotation;\n\
uniform vec4  u_color1;\n\
uniform vec4  u_color2;\n\
uniform vec4  u_color3;\n\
uniform float u_proportion;\n\
uniform float u_softness;\n\
uniform float u_shape;\n\
uniform float u_shapeScale;\n\
uniform float u_distortion;\n\
uniform float u_swirl;\n\
uniform float u_swirlIterations;\n\
out vec4 fragColor;\n\
#define TWO_PI 6.28318530718\n\
#define PI 3.14159265358979323846\n\
vec2 rotate(vec2 uv, float th) {\n\
  return mat2(cos(th), sin(th), -sin(th), cos(th)) * uv;\n\
}\n\
float random(vec2 st) {\n\
  return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);\n\
}\n\
float noise(vec2 st) {\n\
  vec2 i = floor(st);\n\
  vec2 f = fract(st);\n\
  float a = random(i);\n\
  float b = random(i + vec2(1.0, 0.0));\n\
  float c = random(i + vec2(0.0, 1.0));\n\
  float d = random(i + vec2(1.0, 1.0));\n\
  vec2 u = f * f * (3.0 - 2.0 * f);\n\
  float x1 = mix(a, b, u.x);\n\
  float x2 = mix(c, d, u.x);\n\
  return mix(x1, x2, u.y);\n\
}\n\
vec4 blend_colors(vec4 c1, vec4 c2, vec4 c3, float mixer, float edgesWidth, float edge_blur) {\n\
  vec3 color1 = c1.rgb * c1.a;\n\
  vec3 color2 = c2.rgb * c2.a;\n\
  vec3 color3 = c3.rgb * c3.a;\n\
  float r1 = smoothstep(.0 + .35 * edgesWidth, .7 - .35 * edgesWidth + .5 * edge_blur, mixer);\n\
  float r2 = smoothstep(.3 + .35 * edgesWidth, 1. - .35 * edgesWidth + edge_blur, mixer);\n\
  vec3 blended_color_2 = mix(color1, color2, r1);\n\
  float blended_opacity_2 = mix(c1.a, c2.a, r1);\n\
  vec3 c = mix(blended_color_2, color3, r2);\n\

}\n\
void main() {\n\
  vec2 uv = gl_FragCoord.xy / u_resolution.xy;\n\
  float t = .5 * u_time;\n\
  float noise_scale = .0005 + .006 * u_scale;\n\
  uv -= .5;\n\
  uv *= (noise_scale * u_resolution);\n\
  uv = rotate(uv, u_rotation * .5 * PI);\n\
  uv /= u_pixelRatio;\n\
  uv += .5;\n\
  float n1 = noise(uv * 1. + t);\n\
  float n2 = noise(uv * 2. - t);\n\
  float angle = n1 * TWO_PI;\n\
  uv.x += 4. * u_distortion * n2 * cos(angle);\n\
  uv.y += 4. * u_distortion * n2 * sin(angle);\n\
  float iterations_number = ceil(clamp(u_swirlIterations, 1., 30.));\n\
  for (float i = 1.; i <= iterations_number; i++) {\n\
    uv.x += clamp(u_swirl, 0., 2.) / i * cos(t + i * 1.5 * uv.y);\n\
    uv.y += clamp(u_swirl, 0., 2.) / i * cos(t + i * 1. * uv.x);\n\
  }\n\
  float proportion = clamp(u_proportion, 0., 1.);\n\
  float shape = 0.;\n\
  float mixer = 0.;\n\
  if (u_shape < .5) {\n\
    vec2 checks_shape_uv = uv * (.5 + 3.5 * u_shapeScale);\n\
    shape = .5 + .5 * sin(checks_shape_uv.x) * cos(checks_shape_uv.y);\n\
    mixer = shape + .48 * sign(proportion - .5) * pow(abs(proportion - .5), .5);\n\

    vec2 stripes_shape_uv = uv * (.25 + 3. * u_shapeScale);\n\
    float f = fract(stripes_shape_uv.y);\n\
    shape = smoothstep(.0, .55, f) * smoothstep(1., .45, f);\n\
    mixer = shape + .48 * sign(proportion - .5) * pow(abs(proportion - .5), .5);\n\
  } else {\n\
    float sh = 1. - uv.y;\n\
    sh -= .5;\n\
    sh /= (noise_scale * u_resolution.y);\n\
    sh += .5;\n\
    float shape_scaling = .2 * (1. - u_shapeScale);\n\
    shape = smoothstep(.45 - shape_scaling, .55 + shape_scaling, sh + .3 * (proportion - .5));\n\
    mixer = shape;\n\
  }\n\
  vec4 color_mix = blend_colors(u_color1, u_color2, u_color3, mixer, 1. - clamp(u_softness, 0., 1.), .01 + .01 * u_scale);\n\
  fragColor = vec4(color_mix.rgb, color_mix.a);\n\

/* #rgb / #rrggbb / #rrggbbaa — the original also parsed rgb(), hsl() and

function rgba(hex) {

  return [parseInt(c.slice(0, 2), 16) / 255,
          parseInt(c.slice(2, 4), 16) / 255,
          parseInt(c.slice(4, 6), 16) / 255,
          c.length === 8 ? parseInt(c.slice(6, 8), 16) / 255 : 1];

/* The original never checked whether the shaders compiled. On a driver that
   rejects one, it drew nothing and said nothing. */
function compile(gl, type, src) {
  var sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    console.warn("[HeroField] shader:", gl.getShaderInfoLog(sh));
    gl.deleteShader(sh);
    return null;
  }
  return sh;

   "u_shape", "u_shapeScale", "u_distortion", "u_swirl", "u_swirlIterations"

  ctx.stage.textContent = "";

  var dpr = 1;

    var w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));

    gl.uniform2f(U.u_resolution, cv.width, cv.height);
    gl.uniform1f(U.u_pixelRatio, dpr);
    gl.uniform1f(U.u_scale, P.scale);
    gl.uniform1f(U.u_rotation, (P.rotation * Math.PI) / 180);
    gl.uniform4f(U.u_color1, c1[0], c1[1], c1[2], c1[3]);
    gl.uniform4f(U.u_color2, c2[0], c2[1], c2[2], c2[3]);
    gl.uniform4f(U.u_color3, c3[0], c3[1], c3[2], c3[3]);
    gl.uniform1f(U.u_proportion, P.proportion / 100);
    gl.uniform1f(U.u_softness, P.softness / 100);
    gl.uniform1f(U.u_shape, P.shape);
    gl.uniform1f(U.u_shapeScale, P.shapeSize / 100);
    gl.uniform1f(U.u_distortion, P.distortion / 50);
    gl.uniform1f(U.u_swirl, P.swirl / 100);
    gl.uniform1f(U.u_swirlIterations, P.swirl === 0 ? 0 : P.swirlIterations);

    if (raf) cancelAnimationFrame(raf);
    raf = 0;

    clearTimeout(rz);
    rz = setTimeout(function () { size(); if (!running) frame(0); }, 150);
  }, { passive: true });

function boot() {
  if (!window.INSIDUS || !window.INSIDUS.anim) return false;

}
if (!boot()) {
  document.addEventListener("DOMContentLoaded", boot);
  setTimeout(boot, 300);
}
})();

/* ============================================================================
   ProductAnimation — animation module
   The gesture of `parallax-image` (@pulkitxm on 21st.dev): a scroll-linked
   vertical shift on the photograph. Rewritten in vanilla — the original is a
   React wrapper over framer-motion, some 50 KB this site does not load — and
   paired with a clip-path mask that opens upward, which is the half that makes
   the photograph arrive rather than simply be there.

   It does not draw into its stage. The eight product frames already exist in
   the page; this enhances them, and the 60svh stage stays shut.

   Three layers per frame, because the two motions must not share a property:
     .pr-frame   the mask, on the existing .product__media
       .pr-scale the settle from 1.06 to 1, transitioned, driven by a class
         .pr-par the parallax, set inline every frame, never transitioned
   Sharing one transform would make the parallax inherit the 1.3s easing and
   drag behind the scroll.

   Load AFTER assets/js/insidus.js.
   ========================================================================= */
(function () {
"use strict";

var SHIFT = 26;    /* px the photograph travels across a full pass */
var LEAD  = 14;    /* px the name travels the other way */

var CSS = [
".pr-frame{clip-path:inset(100% 0 0 0);",
"transition:clip-path 1.15s cubic-bezier(.22,.72,.28,1)}",
".pr-frame.pr-open{clip-path:inset(0 0 0 0)}",
".pr-scale{position:absolute;inset:0;transform:scale(1.06);will-change:transform;",
"transition:transform 1.4s cubic-bezier(.22,.72,.28,1)}",
".pr-frame.pr-open .pr-scale{transform:scale(1)}",
".pr-par{position:absolute;inset:0;will-change:transform}",

   everything else; this only re-cuts whatever is already on the page, and

      words.forEach(function (w) { w.classList.add("fr-go"); });

   The brief asked for process told with typography, lines and numbers, and
   explicitly not with icons. The stylesheet already draws each stage's accent
   rule when the cell arrives (that is core `js-rise`, no module needed), so
