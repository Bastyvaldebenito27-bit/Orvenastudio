  /* A gradient, not flat accent: three full-width lines at full strength
     shouted next to a page whose every other rule is a hairline. This is the
     same fade the process rails use. */
  ".cf-row::after{content:'';position:absolute;left:0;top:-1px;height:1px;",
  "width:100%;background:linear-gradient(90deg,rgba(169,195,212,.42),",
  "rgba(169,195,212,.10));transform:scaleX(0);",
  "transform-origin:left center;pointer-events:none;",
  "transition:transform 1s cubic-bezier(.22,.72,.28,1);",
  "transition-delay:var(--cf-d,0ms)}",
  ".cf-row.cf-in::after{transform:scaleX(1)}",
  ".cf-row .direct__k,.cf-row .direct__v{opacity:0;transform:translateY(6px);",
  "transition:opacity .7s cubic-bezier(.22,.72,.28,1),",
  "transform .7s cubic-bezier(.22,.72,.28,1)}",
  ".cf-row.cf-in .direct__k,.cf-row.cf-in .direct__v{opacity:1;transform:none}",

  /* The submit fills from the left. The base rule keeps the text colour, so
     a browser that ignores the pseudo-element still gets the plain swap. */
  ".cf-submit{position:relative;overflow:hidden;isolation:isolate}",
  ".cf-submit::before{content:'';position:absolute;inset:0;z-index:-1;",
  "background:var(--accent);transform:scaleX(0);transform-origin:left center;",
  "transition:transform .55s cubic-bezier(.22,.72,.28,1)}",
  ".cf-submit:hover::before,.cf-submit:focus-visible::before{transform:scaleX(1)}",
  ".cf-submit:hover,.cf-submit:focus-visible{background:transparent;",
  "color:var(--abyss);border-color:var(--accent)}",

  /* Reduced motion: the affordances stay, the travel goes. Nothing here may
     leave a label or a row invisible. */
  "@media (prefers-reduced-motion:reduce){",
  ".cf-field::after,.cf-row::after,.cf-submit::before{transition:none}",
  ".cf-row .direct__k,.cf-row .direct__v{opacity:1;transform:none;transition:none}",
  ".cf-field.cf-on label{transform:none}}"
].join("");

function injectCSS() {
  if (document.getElementById("cf-css")) return;
  var st = document.createElement("style");
  st.id = "cf-css";
  st.textContent = CSS;
  document.head.appendChild(st);
}

INSIDUS.anim.register("ContactAnimation", function (ctx) {
  injectCSS();

  var host = ctx.section;
  if (!host) return;

  var seen = null;
  if (!ctx.reduce && "IntersectionObserver" in window) {
    seen = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add("cf-in");
        seen.unobserve(e.target);
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.2 });
  }

  function prepare() {
    /* Fields. The listeners are bound once per element — the form is not
       re-rendered on a language change, only its labels are rewritten. */
    Array.prototype.forEach.call(host.querySelectorAll(".field"), function (f) {
      if (f.classList.contains("cf-field")) return;
      f.classList.add("cf-field");
      var input = f.querySelector("input, select, textarea");
      if (!input) return;
      input.addEventListener("focus", function () { f.classList.add("cf-on"); });
      input.addEventListener("blur", function () {
        /* A field the visitor has filled keeps its underline: it reads as
           done rather than as reset. */
        if (!input.value) f.classList.remove("cf-on");
      });
      if (input.value) f.classList.add("cf-on");
    });

    /* Direct rows. These ARE re-rendered on every language change, so they
       are re-observed each time rather than marked once. */
    Array.prototype.forEach.call(host.querySelectorAll(".direct__row"), function (r, i) {
      if (r.classList.contains("cf-row")) return;
      r.classList.add("cf-row");
      if (ctx.reduce || !seen) { r.classList.add("cf-in"); return; }
      var d = (i * 140) + "ms";
      if (r.querySelector(".direct__k")) r.querySelector(".direct__k").style.transitionDelay = d;
      if (r.querySelector(".direct__v")) r.querySelector(".direct__v").style.transitionDelay = d;
      r.style.setProperty("--cf-d", d);
      seen.observe(r);
    });

    var sub = host.querySelector(".submit");
    if (sub) sub.classList.add("cf-submit");
  }

  /* The rows and the select are built by the app after the locale resolves,
     and rebuilt on every language change. The listener goes on first. */
  document.addEventListener("insidus:rendered", prepare);
  prepare();
});
})();

/* =========================================================================
   PageTransition — the index row becomes the product hero.

   Clicking a species used to be a hard cut: the index disappears, the ficha
   appears, and the buyer has to find their place again. The species name and
   its number are the one thing the two pages genuinely share, so they travel
   between them and the rest of the page crosses over behind.

   This is the only module that is not a slot: it has nothing to draw, it
   enhances a navigation. It carries no markup, no styles of its own and no
   state — the stylesheet holds the timings, and all this file does is say
   which two elements are the same subject, a moment before the browser
   navigates.

   Nothing here is required. A browser without view transitions navigates as
   it always did; delete the file and so does every browser.
   ========================================================================= */
(function () {
"use strict";

var W = window, D = document;

/* Cross-document transitions are driven by the stylesheet's @view-transition,
   not from here. Without support for the naming property there is nothing
   this file can usefully say, so it stands down rather than tagging elements
   no engine will read. */
if (!W.CSS || !CSS.supports || !CSS.supports("view-transition-name", "x")) return;
if (W.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

var TITLE = "sp-title", NUM = "sp-num";

/* A view-transition-name has to be unique in the document. The index holds
   seven rows and the featured card an eighth: tagging them all would leave
   seven subjects animating alone. So the tag is applied to one row — the one
   actually clicked — and cleared again on the way back. */
function untag() {
  var tagged = D.querySelectorAll("[data-vt]");
  for (var i = 0; i < tagged.length; i++) {
    tagged[i].style.viewTransitionName = "";
    tagged[i].removeAttribute("data-vt");
  }
}

function tag(node, name) {
  if (!node) return;
  node.style.viewTransitionName = name;
  node.setAttribute("data-vt", name);
}

/* Both shapes that link to a ficha: the index row and the featured card.
   The link is the anchor in either case, but the name and number sit beside
   it in the card and inside it in the row, so the search starts from
   whichever container holds them. */
function subject(link) {
  return link.closest(".index__row") || link.closest(".product") || link;
}

D.addEventListener("click", function (e) {
  var link = e.target.closest && e.target.closest("a[data-slug]");
  if (!link) return;
  /* Let the browser keep its own behaviour for anything that is not a plain
     left-click: a new tab has no transition to run. */
  if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  var host = subject(link);
  untag();
  tag(host.querySelector(".index__name, .product__name"), TITLE);
  tag(host.querySelector(".num"), NUM);
}, true);

/* The ficha's side of the pair. #p-name and #p-num survive re-rendering —
   only their text is replaced — but a language switch re-runs render, so the
   tag is re-applied on every render rather than once at load. */
function tagProduct() {
  if (D.body.getAttribute("data-page") !== "product") return;
  untag();
  tag(D.getElementById("p-name"), TITLE);
  tag(D.getElementById("p-num"), NUM);
}
tagProduct();
D.addEventListener("insidus:rendered", tagProduct);

/* Coming back from a ficha, the home page may be served from the back-forward
   cache with the tag still on the row that was clicked. Left there it would
   claim the name on the next navigation, whichever row is clicked then. */
W.addEventListener("pageshow", function (e) {
  if (!e.persisted) return;
  if (D.body.getAttribute("data-page") === "product") tagProduct(); else untag();
});

})();

</script>
