<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"></head><body>
<title>INSIDUS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Deliberately single-world: a deep-water export brand. Every colour is painted
   explicitly so the page holds on any host ground. */
:root{
  color-scheme:dark;
  --abyss:#060F0E; --deep:#0B1918; --slate:#122423; --line:#1E3634;
  --foam:#E9EFEC; --muted:#8B9E99; --dim:#5E716D;
  --signal:#E4632B; --signal-soft:#F08A5A;
  --font-d:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--abyss);color:var(--foam);font-family:var(--font-d);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.wrap{width:min(1200px,100% - 2.5rem);margin-inline:auto}
.eyebrow{font-family:var(--font-m);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--signal);margin:0}
.pending{font-family:var(--font-m);font-size:.72rem;color:var(--signal-soft);
  border-bottom:1px dashed rgba(240,138,90,.45)}
.sec{padding:clamp(3.6rem,8vw,7rem) 0;border-bottom:1px solid var(--line)}
.sec--fill{background:var(--deep)}
.sec__h{font-weight:800;letter-spacing:.01em;line-height:1.04;
  font-size:clamp(1.75rem,4.6vw,3rem);margin:.7rem 0 .9rem;text-wrap:balance}
.sec__lead{color:var(--muted);max-width:62ch;margin:0}

/* ---------- bar ---------- */
.bar{position:sticky;top:0;z-index:40;padding:.72rem 0;background:rgba(6,15,14,.84);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar__in{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  width:min(1200px,100% - 2.5rem);margin-inline:auto}
.bar__logo{font-weight:800;letter-spacing:.26em;font-size:.9rem}
.bar__right{display:flex;align-items:center;gap:clamp(.55rem,2vw,1.4rem)}
.bar__nav{display:flex;gap:clamp(.65rem,1.7vw,1.5rem);list-style:none;margin:0;padding:0}
.bar__nav a{font-family:var(--font-m);font-size:.71rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;white-space:nowrap;padding-bottom:2px;
  border-bottom:1px solid transparent}
.bar__nav a:hover,.bar__nav a[aria-current="true"]{color:var(--foam);border-bottom-color:var(--signal)}
.sel{font-family:var(--font-m);font-size:.71rem;letter-spacing:.08em;color:var(--foam);
  background:var(--slate);border:1px solid var(--line);border-radius:2px;padding:.34rem .55rem;cursor:pointer}
@media (width < 900px){.bar__nav{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;min-height:74vh;display:flex;flex-direction:column;overflow:hidden;
  border-bottom:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% -25%,#14312E 0%,rgba(20,49,46,0) 62%),
             linear-gradient(180deg,#081412 0%,var(--abyss) 100%)}
#motes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero__in{position:relative;z-index:2;padding:clamp(3rem,10vh,6rem) 0 0;margin-bottom:auto}
.hero__mark{font-weight:800;line-height:.9;letter-spacing:.16em;
  font-size:clamp(2.8rem,12vw,8.4rem);margin:.5rem 0 0}
.hero__rule{width:64px;height:2px;background:var(--signal);margin:1.5rem 0 1.2rem}
.hero__claim{font-family:var(--font-m);letter-spacing:.2em;text-transform:uppercase;
  font-size:clamp(.74rem,1.8vw,.92rem);color:var(--foam);margin:0;min-height:2.8em;max-width:30ch;
  transition:opacity .5s}
.hero__claim.is-out{opacity:0}
.cta{display:inline-block;margin-top:1.6rem;font-family:var(--font-m);font-size:.76rem;
  letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--abyss);
  background:var(--signal);padding:.78rem 1.6rem;border:1px solid var(--signal);
  transition:background .25s,color .25s}
.cta:hover{background:transparent;color:var(--signal)}
.hero__cue{position:relative;z-index:2;display:flex;align-items:center;gap:.6rem;
  font-family:var(--font-m);font-size:.67rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);padding-bottom:2rem;margin-top:2.4rem}
.hero__cue i{width:52px;height:1px;background:var(--dim);display:block;font-style:normal}

/* ---------- stats ---------- */
.stats{display:grid;gap:1px;background:var(--line);margin-top:3rem;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat{background:var(--deep);padding:1.7rem 1.4rem}
.stat__n{font-weight:800;font-size:clamp(2.2rem,5.5vw,3.4rem);line-height:1;
  font-variant-numeric:tabular-nums}
.stat__l{font-family:var(--font-m);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-top:.5rem}
.quote-line{border-left:2px solid var(--signal);padding-left:1.2rem;margin:2.6rem 0 0;
  color:var(--foam);font-size:clamp(1rem,2.4vw,1.2rem);max-width:56ch}

/* ---------- products ---------- */
.grid{display:grid;gap:clamp(.9rem,2vw,1.4rem);margin-top:2.8rem;
  grid-template-columns:repeat(auto-fill,minmax(238px,1fr))}
.card{background:var(--deep);border:1px solid var(--line);display:flex;flex-direction:column;
  transition:border-color .35s,transform .35s}
.card:hover{border-color:var(--signal);transform:translateY(-3px)}
.card__media{padding:1.3rem 1.3rem .9rem;display:flex;justify-content:center}
/* Source photographs are 200px square: held at native size so they stay sharp. */
.card__plate{position:relative;width:200px;max-width:100%;aspect-ratio:1;
  background:var(--slate);border:1px solid var(--line);padding:8px}
.card__plate img{width:100%;height:100%;object-fit:cover}
.card__tick{position:absolute;width:8px;height:8px;border:1px solid var(--signal);opacity:.7}
.card__tick--tl{top:-1px;left:-1px;border-right:0;border-bottom:0}
.card__tick--br{bottom:-1px;right:-1px;border-left:0;border-top:0}
.card__body{padding:0 1.3rem 1.4rem;display:flex;flex-direction:column;gap:.28rem}
.card__name{font-weight:800;letter-spacing:.05em;font-size:1.22rem;margin:0;line-height:1.15}
.card__trade{font-family:var(--font-m);font-size:.74rem;letter-spacing:.05em;color:var(--muted);margin:0}
.card__bino{font-family:var(--font-m);font-style:italic;font-size:.76rem;color:var(--signal-soft);margin:.2rem 0 0}

/* ---------- testimonials ---------- */
.quotes{display:grid;gap:1px;background:var(--line);margin-top:2.8rem;
  grid-template-columns:repeat(auto-fit,minmax(258px,1fr))}
.quote{background:var(--abyss);padding:1.7rem 1.5rem;display:flex;flex-direction:column;gap:1rem}
.quote__t{margin:0;color:var(--foam);font-size:.97rem}
.quote__a{font-family:var(--font-m);font-size:.72rem;letter-spacing:.1em;color:var(--dim);
  margin:auto 0 0;text-transform:uppercase}

/* ---------- team ---------- */
.team{display:grid;gap:1px;background:var(--line);margin-top:2.8rem;
  grid-template-columns:repeat(auto-fit,minmax(216px,1fr))}
.person{background:var(--deep);padding:1.6rem 1.4rem}
.person__ini{font-family:var(--font-m);font-size:.82rem;letter-spacing:.16em;color:var(--signal);
  border:1px solid var(--line);width:48px;height:48px;display:flex;align-items:center;
  justify-content:center;margin-bottom:1.1rem}
.person__n{font-weight:600;font-size:.98rem;margin:0;letter-spacing:.02em}
.person__r{font-family:var(--font-m);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:.3rem 0 0}

/* ---------- plant / contact rows ---------- */
.rows{display:grid;gap:0;max-width:560px;margin-top:2.2rem}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:1.4rem;
  padding:.72rem 0;border-top:1px solid var(--line)}
.row__k{font-family:var(--font-m);font-size:.73rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap}
.row__v{text-align:right;font-size:.92rem}
.row__v a{text-decoration:none;border-bottom:1px solid var(--line)}
.row__v a:hover{border-bottom-color:var(--signal)}
.plant__body{display:grid;gap:1.4rem;max-width:64ch;margin-top:1.4rem;color:var(--muted)}
.plant__body p{margin:0}

.foot{padding:2.8rem 0;text-align:center}
.foot__mark{font-weight:800;letter-spacing:.26em;font-size:.85rem}
.foot__note{font-family:var(--font-m);font-size:.7rem;letter-spacing:.05em;color:var(--dim);margin:.55rem 0 0}
</style>

<header class="bar">
  <div class="bar__in">
    <span class="bar__logo">INSIDUS</span>
    <div class="bar__right">
      <ul class="bar__nav" id="nav"></ul>
      <select class="sel" id="lang" aria-label="Language / Idioma"></select>
    </div>
  </div>
</header>

<section class="hero">
  <canvas id="motes" aria-hidden="true"></canvas>
  <div class="hero__in"><div class="wrap">
    <p class="eyebrow" id="h-eyebrow"></p>
    <h1 class="hero__mark">INSIDUS</h1>
    <div class="hero__rule"></div>
    <p class="hero__claim" id="h-claim"></p>
    <a class="cta" href="#contacto" id="h-cta"></a>
  </div></div>
  <div class="wrap hero__cue"><span id="h-scroll"></span><i></i></div>
</section>

<main>
  <section class="sec" id="nosotros"><div class="wrap">
    <p class="eyebrow" id="a-eyebrow"></p>
    <h2 class="sec__h" id="a-title"></h2>
    <p class="sec__lead" id="a-body"></p>
    <div class="stats" id="a-stats"></div>
    <blockquote class="quote-line" id="a-quote"></blockquote>
  </div></section>

  <section class="sec sec--fill" id="productos"><div class="wrap">
    <p class="eyebrow" id="p-eyebrow"></p>
    <h2 class="sec__h" id="p-title"></h2>
    <p class="sec__lead" id="p-lead"></p>
    <div class="grid" id="p-grid"></div>
  </div></section>

  <section class="sec" id="clientes"><div class="wrap">
    <p class="eyebrow" id="t-eyebrow"></p>
    <h2 class="sec__h" id="t-title"></h2>
    <div class="quotes" id="t-list"></div>
  </div></section>

  <section class="sec sec--fill" id="planta"><div class="wrap">
    <p class="eyebrow" id="l-eyebrow"></p>
    <h2 class="sec__h" id="l-title"></h2>
    <div class="plant__body" id="l-body"></div>
    <div class="rows" id="l-rows"></div>
  </div></section>

  <section class="sec" id="equipo"><div class="wrap">
    <p class="eyebrow" id="e-eyebrow"></p>
    <h2 class="sec__h" id="e-title"></h2>
    <p class="sec__lead" id="e-lead"></p>
    <div class="team" id="e-list"></div>
  </div></section>

  <section class="sec sec--fill" id="contacto"><div class="wrap">
    <p class="eyebrow" id="k-eyebrow"></p>
    <h2 class="sec__h" id="k-title"></h2>
    <p class="sec__lead" id="k-lead"></p>
    <div class="rows" id="k-rows"></div>
  </div></section>
</main>

<footer class="foot">
  <div class="foot__mark">INSIDUS</div>
  <p class="foot__note" id="f-note"></p>
</footer>

var STORE="insidus-language";

function pick(){
  try{var s=localStorage.getItem(STORE);if(s&&I18N[s])return s;}catch(e){}
  try{
    var n=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||"es"];
    for(var i=0;i<n.length;i++){
      var t=String(n[i]).toLowerCase();
      if(t.indexOf("zh-tw")===0||t.indexOf("zh-hant")===0)return "zh-TW";
      if(t.indexOf("zh")===0)return "zh-CN";
      var b=t.split("-")[0];
      if(I18N[b])return b;
    }
  }catch(e){}
  return "es";
}
function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;
  if(txt!=null)n.textContent=txt;return n;}
function set(id,txt){var n=document.getElementById(id);if(n)n.textContent=txt;}
function clear(id){var n=document.getElementById(id);if(n)n.textContent="";return n;}

var claimTimer=null;
function runClaims(list){
  var node=document.getElementById("h-claim"),i=0;
  node.textContent=list[0];
  if(claimTimer){clearInterval(claimTimer);claimTimer=null;}
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  claimTimer=setInterval(function(){
    node.classList.add("is-out");
    setTimeout(function(){i=(i+1)%list.length;node.textContent=list[i];
      node.classList.remove("is-out");},500);
  },4200);
}

function draw(code){
  var d=I18N[code]||I18N.es;

  var nav=clear("nav");

  set("a-eyebrow",d.nav[0]);set("a-title",d.about[0]);set("a-body",d.about[1]);

    b.appendChild(el("p","card__trade",s.trade));
    b.appendChild(el("p","card__bino",s.bino));
    c.appendChild(m);c.appendChild(b);g.appendChild(c);
  });

  set("t-eyebrow",d.clientsEyebrow);set("t-title",d.clients);
  var q=clear("t-list");
  d.quotes.forEach(function(x){

  set("l-eyebrow",d.nav[2]);set("l-title",d.plant[0]);
  var lb=clear("l-body");

  lb.appendChild(el("p",null,d.plant[2]));
  var lr=clear("l-rows");
  [[d.plantRows[0],FACTS.area],[d.plantRows[1],FACTS.capacity],[d.plantRows[2],FACTS.city]]

  });

  set("e-eyebrow",d.nav[3]);set("e-title",d.team[0]);set("e-lead",d.team[1]);

    var b=el("div","person");
    b.appendChild(el("div","person__ini",p.split(" ").slice(0,2).map(function(w){return w[0];}).join("")));
    b.appendChild(el("p","person__n",p));

  set("k-eyebrow",d.nav[4]);set("k-title",d.contact[0]);set("k-lead",d.contact[1]);

var sel=document.getElementById("lang");

sel.addEventListener("change",function(){

});

var obs=new IntersectionObserver(function(es){
  es.forEach(function(e){
    if(!e.isIntersecting)return;
    var id="#"+e.target.id;
    Array.prototype.forEach.call(document.querySelectorAll("#nav a"),function(a){
      a.setAttribute("aria-current",a.getAttribute("href")===id?"true":"false");
    });
  });
},{rootMargin:"-45% 0px -50% 0px"});
["nosotros","productos","planta","equipo","contacto"].forEach(function(id){
  var n=document.getElementById(id);if(n)obs.observe(n);
});

/* ambient marine snow over the hero */
var cv=document.getElementById("motes"),ctx=cv.getContext("2d"),motes=[];
function size(){
  var r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);motes=[];
  var n=Math.round(Math.min(70,r.width/16));
  for(var i=0;i<n;i++)motes.push({x:Math.random()*r.width,y:Math.random()*r.height,
    r:.5+Math.random()*1.7,v:.06+Math.random()*.22,a:.10+Math.random()*.30,
    d:Math.random()*Math.PI*2});
}
function frame(){
  var r=cv.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);
  for(var i=0;i<motes.length;i++){
    var m=motes[i];m.y-=m.v;m.d+=.006;
    if(m.y<-4){m.y=r.height+4;m.x=Math.random()*r.width;}
    ctx.globalAlpha=m.a;ctx.fillStyle="#CFE3DC";
    ctx.beginPath();ctx.arc(m.x+Math.sin(m.d)*7,m.y,m.r,0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches)requestAnimationFrame(frame);
}
size();frame();
window.addEventListener("resize",size,{passive:true});
})();
