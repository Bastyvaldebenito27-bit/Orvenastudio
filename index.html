<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"></head><body>
<title>INSIDUS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* A photobook of the operation, printed on cool paper. Committed single-world:
   every colour painted explicitly so the page holds on any host ground. */
:root{
  color-scheme:light;
  --paper:#E9EBEA;      /* cool plant-wall grey, not a warm cream */
  --card:#FFFFFF;
  --ink:#0A0F11;
  --ash:#5C6668;
  --rule:#C6CBC9;
  --deep:#08171D;       /* sea ink, for the full-bleed dark bands */
  --deep-2:#0E262F;
  --flare:#FF4A17;      /* the one bold note */
  --fd:"Big Shoulders Display","Archivo Narrow",Impact,sans-serif;
  --fb:"Archivo","Helvetica Neue",Arial,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--flare);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.wrap{width:min(1240px,100% - 2.5rem);margin-inline:auto}
.kicker{font-family:var(--fm);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--flare);margin:0}
.h2{font-family:var(--fd);font-weight:800;text-transform:uppercase;line-height:.88;
  letter-spacing:.005em;font-size:clamp(2.6rem,8vw,5.6rem);margin:.5rem 0 1rem}
.lead{color:var(--ash);max-width:60ch;margin:0;font-size:clamp(.96rem,2vw,1.06rem)}
.band{padding:clamp(3.4rem,8vw,6.5rem) 0}
.band--ink{background:var(--deep);color:#EEF2F1}
.band--ink .lead{color:#9FB0AE}
.band--ink .h2{color:#fff}
.band+.band{border-top:1px solid var(--rule)}
.band--ink+.band,.band+.band--ink{border-top:0}

/* ---------- bar ---------- */
.bar{position:sticky;top:0;z-index:50;background:rgba(233,235,234,.9);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
.bar__in{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  width:min(1240px,100% - 2.5rem);margin-inline:auto;padding:.6rem 0}
.bar__logo{font-family:var(--fd);font-weight:800;font-size:1.5rem;letter-spacing:.08em;line-height:1}
.bar__right{display:flex;align-items:center;gap:clamp(.5rem,2vw,1.3rem)}
.bar__nav{display:flex;gap:clamp(.6rem,1.6vw,1.4rem);list-style:none;margin:0;padding:0}
.bar__nav a{font-family:var(--fm);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ash);text-decoration:none;white-space:nowrap;padding-bottom:2px;
  border-bottom:1px solid transparent}
.bar__nav a:hover,.bar__nav a[aria-current="true"]{color:var(--ink);border-bottom-color:var(--flare)}
.sel{font-family:var(--fm);font-size:.7rem;letter-spacing:.06em;color:var(--ink);background:var(--card);
  border:1px solid var(--rule);border-radius:0;padding:.32rem .5rem;cursor:pointer}
@media (width < 900px){.bar__nav{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;min-height:min(84vh,760px);display:flex;align-items:flex-end;
  overflow:hidden;background:var(--deep)}
.hero__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%}
.hero__scrim{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(8,23,29,.62) 0%,rgba(8,23,29,.12) 38%,rgba(8,23,29,.9) 100%)}
.hero__in{position:relative;z-index:2;width:100%;padding-bottom:clamp(2rem,5vw,3.4rem);
  padding-top:clamp(4rem,12vh,7rem)}
.hero__kicker{font-family:var(--fm);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;
  color:#fff;margin:0;opacity:.85}
.hero__mark{font-family:var(--fd);font-weight:800;color:#fff;line-height:.8;
  font-size:clamp(4.2rem,19vw,15rem);letter-spacing:.01em;margin:.4rem 0 0}
.hero__bottom{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
  gap:1.4rem;margin-top:1.4rem}
.hero__claim{font-family:var(--fm);font-size:clamp(.74rem,1.7vw,.9rem);letter-spacing:.16em;
  text-transform:uppercase;color:#fff;margin:0;max-width:30ch;min-height:2.6em;transition:opacity .5s}
.hero__claim.is-out{opacity:0}
.cta{display:inline-block;font-family:var(--fm);font-size:.74rem;letter-spacing:.18em;
  text-transform:uppercase;text-decoration:none;color:#fff;background:var(--flare);
  padding:.85rem 1.7rem;border:1px solid var(--flare);transition:background .25s,color .25s}
.cta:hover{background:transparent;color:#fff}
.hero__cap{position:absolute;right:0;bottom:0;z-index:2;font-family:var(--fm);font-size:.62rem;
  letter-spacing:.08em;color:rgba(255,255,255,.62);padding:.5rem .8rem;text-align:right;max-width:60%}

/* ---------- figures ---------- */
.figs{display:grid;gap:1px;background:var(--rule);margin-top:2.6rem;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.fig{background:var(--paper);padding:1.5rem 1.3rem}
.fig__n{font-family:var(--fd);font-weight:800;font-size:clamp(3rem,8vw,5rem);line-height:.82;
  font-variant-numeric:tabular-nums}
.fig__l{font-family:var(--fm);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ash);margin-top:.6rem}
.pull{border-left:3px solid var(--flare);padding-left:1.3rem;margin:2.8rem 0 0;
  font-family:var(--fd);font-weight:600;text-transform:uppercase;line-height:1;
  font-size:clamp(1.5rem,4vw,2.6rem);max-width:22ch}

.split{display:grid;gap:clamp(1.4rem,4vw,3rem);align-items:center;
  grid-template-columns:minmax(0,1fr) minmax(0,380px);margin-top:2.8rem}
@media (width < 860px){.split{grid-template-columns:1fr}}
.shot{margin:0}
.shot img{width:100%;height:auto}
.shot figcaption{font-family:var(--fm);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ash);margin-top:.6rem}
.band--ink .shot figcaption{color:#8DA09E}

/* ---------- species strip (drag / scroll horizontally) ---------- */
.strip{display:flex;gap:1px;background:var(--rule);overflow-x:auto;overscroll-behavior-x:contain;
  scroll-snap-type:x mandatory;margin-top:2.4rem;cursor:grab;
  scrollbar-width:thin;scrollbar-color:var(--ash) var(--paper)}
.strip.is-drag{cursor:grabbing;scroll-snap-type:none}
.strip::-webkit-scrollbar{height:6px}
.strip::-webkit-scrollbar-thumb{background:var(--ash)}
.sp{flex:0 0 clamp(224px,25vw,286px);scroll-snap-align:start;background:var(--card);
  padding:1.3rem 1.25rem 1.5rem;display:flex;flex-direction:column;gap:.9rem;
  transition:background .3s}
.sp:hover{background:#F7F8F8}
.sp__ix{font-family:var(--fm);font-size:.66rem;letter-spacing:.16em;color:var(--flare)}
.sp__img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--paper)}
.sp__name{font-family:var(--fd);font-weight:800;text-transform:uppercase;line-height:.9;
  font-size:clamp(1.5rem,3.4vw,2rem);margin:0}
.sp__trade{font-family:var(--fm);font-size:.7rem;letter-spacing:.04em;color:var(--ash);margin:0}
.sp__bino{font-family:var(--fm);font-style:italic;font-size:.72rem;color:var(--flare);margin:0}
.strip__hint{font-family:var(--fm);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ash);margin:.9rem 0 0;display:flex;align-items:center;gap:.6rem}
.strip__hint i{display:block;width:40px;height:1px;background:var(--rule);font-style:normal}

/* ---------- quotes ---------- */
.quotes{display:grid;gap:1px;background:rgba(255,255,255,.12);margin-top:2.6rem;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.qt{background:var(--deep);padding:1.6rem 1.4rem;display:flex;flex-direction:column;gap:1rem}
.qt__t{margin:0;font-size:.98rem;color:#EEF2F1}
.qt__a{font-family:var(--fm);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:#8DA09E;margin:auto 0 0}

/* ---------- plant / team / rows ---------- */
.duo{display:grid;gap:1px;background:var(--rule);margin-top:2.6rem;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.duo figure{margin:0;background:var(--paper)}
.duo img{width:100%;height:clamp(220px,30vw,340px);object-fit:cover}
.duo figcaption{font-family:var(--fm);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ash);padding:.7rem .9rem}

.rows{display:grid;max-width:600px;margin-top:2.4rem}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:1.4rem;
  padding:.78rem 0;border-top:1px solid var(--rule)}
.band--ink .row{border-top-color:rgba(255,255,255,.16)}
.row__k{font-family:var(--fm);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ash);white-space:nowrap}
.band--ink .row__k{color:#8DA09E}
.row__v{text-align:right;font-size:.94rem}
.row__v a{text-decoration:none;border-bottom:1px solid var(--rule)}
.row__v a:hover{border-bottom-color:var(--flare)}

.team{display:grid;gap:1px;background:var(--rule);margin-top:2.6rem;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.person{background:var(--paper);padding:1.5rem 1.3rem}
.person__ini{font-family:var(--fd);font-weight:800;font-size:1.6rem;color:var(--flare);line-height:1}
.person__n{font-weight:600;font-size:.98rem;margin:.9rem 0 0}
.person__r{font-family:var(--fm);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ash);margin:.28rem 0 0}

.foot{background:var(--deep);color:#8DA09E;padding:2.6rem 0;text-align:center}
.foot__mark{font-family:var(--fd);font-weight:800;font-size:1.8rem;color:#fff;letter-spacing:.06em}
.foot__note{font-family:var(--fm);font-size:.68rem;letter-spacing:.05em;margin:.5rem 0 0}
</style>

<header class="bar">
  <div class="bar__in">
    <span class="bar__logo">INSIDUS</span>
    <div class="bar__right">
      <ul class="bar__nav" id="nav"></ul>
      <select class="sel" id="lang" aria-label="Language / Idioma"></select>
    </div>
  </div>
</header>

<section class="hero">
  <img class="hero__img" id="hero-img" alt="">
  <div class="hero__scrim"></div>
  <div class="hero__in"><div class="wrap">
    <p class="hero__kicker" id="h-kicker"></p>
    <h1 class="hero__mark">INSIDUS</h1>
    <div class="hero__bottom">
      <p class="hero__claim" id="h-claim"></p>
      <a class="cta" href="#contacto" id="h-cta"></a>
    </div>
  </div></div>
  <p class="hero__cap" id="h-cap"></p>
</section>

<main>
  <section class="band" id="nosotros"><div class="wrap">
    <p class="kicker" id="a-kicker"></p>
    <h2 class="h2" id="a-title"></h2>
    <div class="split">
      <div>
        <p class="lead" id="a-body"></p>
        <blockquote class="pull" id="a-pull"></blockquote>
      </div>
      <figure class="shot"><img id="a-img" alt=""><figcaption id="a-cap"></figcaption></figure>
    </div>
    <div class="figs" id="a-figs"></div>
  </section></div>

  <section class="band" id="productos"><div class="wrap">
    <p class="kicker" id="p-kicker"></p>
    <h2 class="h2" id="p-title"></h2>
    <p class="lead" id="p-lead"></p>
  </div>
    <div class="wrap"><div class="strip" id="p-strip"></div>
    <p class="strip__hint"><i></i><span id="p-hint"></span></p></div>
  </section>

  <section class="band band--ink" id="clientes"><div class="wrap">
    <p class="kicker" id="t-kicker"></p>
    <h2 class="h2" id="t-title"></h2>
    <div class="quotes" id="t-list"></div>
  </div></section>

  <section class="band" id="planta"><div class="wrap">
    <p class="kicker" id="l-kicker"></p>
    <h2 class="h2" id="l-title"></h2>
    <p class="lead" id="l-body1"></p>
    <div class="duo" id="l-duo"></div>
    <p class="lead" id="l-body2" style="margin-top:2.2rem"></p>
    <div class="rows" id="l-rows"></div>
  </div></section>

  <section class="band" id="equipo"><div class="wrap">
    <p class="kicker" id="e-kicker"></p>
    <h2 class="h2" id="e-title"></h2>
    <p class="lead" id="e-lead"></p>
    <div class="team" id="e-list"></div>
  </div></section>

  <section class="band band--ink" id="contacto"><div class="wrap">
    <p class="kicker" id="k-kicker"></p>
    <h2 class="h2" id="k-title"></h2>
    <div class="split">
      <div>
        <p class="lead" id="k-lead"></p>
        <div class="rows" id="k-rows"></div>
      </div>
      <figure class="shot"><img id="k-img" alt=""><figcaption id="k-cap"></figcaption></figure>
    </div>
  </div></section>
</main>

<footer class="foot">
  <div class="foot__mark">INSIDUS</div>
  <p class="foot__note" id="f-note"></p>
</footer>

var STORE="insidus-language";

function pick(){
  try{var s=localStorage.getItem(STORE);if(s&&I18N[s])return s;}catch(e){}
  try{
    var n=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||"es"];
    for(var i=0;i<n.length;i++){
      var t=String(n[i]).toLowerCase();
      if(t.indexOf("zh-tw")===0||t.indexOf("zh-hant")===0)return "zh-TW";
      if(t.indexOf("zh")===0)return "zh-CN";
      var b=t.split("-")[0];if(I18N[b])return b;
    }
  }catch(e){}
  return "es";
}

var timer=null;
function claims(list){
  var n=document.getElementById("h-claim"),i=0;
  n.textContent=list[0];
  if(timer){clearInterval(timer);timer=null;}
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  timer=setInterval(function(){
    n.classList.add("is-out");
    setTimeout(function(){i=(i+1)%list.length;n.textContent=list[i];n.classList.remove("is-out");},480);
  },4200);
}

/* drag-to-pan the species strip; native scroll and touch keep working */
(function(){
  var s=document.getElementById("p-strip"),down=false,x0=0,l0=0,moved=0;
  s.addEventListener("pointerdown",function(e){
    if(e.pointerType==="touch")return;
    down=true;moved=0;x0=e.clientX;l0=s.scrollLeft;s.classList.add("is-drag");
    s.setPointerCapture(e.pointerId);
  });
  s.addEventListener("pointermove",function(e){
    if(!down)return;var dx=e.clientX-x0;moved=Math.max(moved,Math.abs(dx));
    s.scrollLeft=l0-dx;
  });
  function up(e){
    if(!down)return;down=false;s.classList.remove("is-drag");
    try{s.releasePointerCapture(e.pointerId);}catch(_){}
  }
  s.addEventListener("pointerup",up);s.addEventListener("pointercancel",up);
  s.addEventListener("click",function(e){if(moved>6)e.preventDefault();},true);
})();
