  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 20px 16px 26px;
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(233, 180, 76, 0.10), transparent 62%),
    radial-gradient(900px 600px at 10% 105%, rgba(179, 28, 30, 0.14), transparent 60%),
    var(--bg);
  min-height: 100%;
}

.masthead {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  flex-wrap: wrap;
  justify-content: center;
}
.masthead b {
  font-family: 'Alfa Slab One', Georgia, serif;
  letter-spacing: 0.06em;
  color: var(--gold);
  font-weight: 400;
}
.masthead .dot { color: var(--line); }

.stage-wrap {
  position: relative;
  flex: 0 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stage {
  position: relative;
  aspect-ratio: 9 / 16;
  height: min(72vh, 1080px);
  max-width: min(92vw, 608px);
  border-radius: 26px;
  overflow: hidden;
  background: #000;
  box-shadow:
    0 0 0 1px rgba(233, 180, 76, 0.22),
    0 40px 90px -30px rgba(0, 0, 0, 0.9),
    0 0 120px -40px rgba(255, 138, 43, 0.4);
}

#reel {
  display: block;
  width: 100%;
  height: 100%;
}

.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 46%, rgba(10, 6, 4, 0.35), rgba(4, 3, 6, 0.82));
  cursor: pointer;
  transition: opacity 0.35s ease;
  backdrop-filter: blur(2px);
}
.overlay.hidden { opacity: 0; pointer-events: none; }

.play-btn {
  display: grid;
  place-items: center;
  gap: 14px;
  text-align: center;
}
.play-circle {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #F7DC9A, #E9B44C 55%, #C9822A);
  box-shadow: 0 0 44px rgba(233, 180, 76, 0.5), inset 0 2px 8px rgba(255, 255, 255, 0.5);
  animation: pulse 2.4s ease-in-out infinite;
}
.play-circle svg { margin-left: 6px; }
@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(233, 180, 76, 0.42); }
  50% { transform: scale(1.055); box-shadow: 0 0 66px rgba(233, 180, 76, 0.62); }
}
.play-label {
  font-size: 12px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--cream);
  opacity: 0.86;
}

.scrubber {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 4px;
  background: rgba(255, 255, 255, 0.14);
}
.scrubber i {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--red), var(--gold) 55%, var(--gold-light));
  transition: width 0.06s linear;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
  max-width: 660px;
}

button.ctl {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--txt);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 10px 16px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
}
button.ctl:hover { background: rgba(233, 180, 76, 0.16); border-color: rgba(233, 180, 76, 0.55); }
button.ctl:active { transform: translateY(1px); }
button.ctl[data-on="true"] { background: rgba(233, 180, 76, 0.22); border-color: var(--gold); color: #FFF3D8; }
button.ctl.primary {
  background: linear-gradient(140deg, #C9282A, #8E1416);
  border-color: rgba(255, 210, 140, 0.45);
  color: #FFF1DC;
}
button.ctl.primary:hover { background: linear-gradient(140deg, #DE3234, #A0181A); }
button.ctl:disabled { opacity: 0.45; cursor: progress; }

.meta {
  display: flex;
  gap: 14px;
  align-items: center;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.meta .scene { color: var(--gold-light); min-width: 190px; text-align: center; }

.status {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--muted);
  min-height: 15px;
  text-align: center;
}

@media (max-width: 520px) {
  .stage { height: min(66vh, 900px); }
  .masthead { font-size: 10px; letter-spacing: 0.14em; }
  .masthead .aside { display: none; }
  button.ctl { padding: 9px 13px; font-size: 11px; }
  .meta .scene { min-width: 150px; }
}

</style>
</head>

  /* Empanada dorada (media luna con repulgue). */
  A.pastry = function (ctx, x, y, s, rot, seed) {
    var r = U.rng(seed);

    ctx.translate(x, y);
    ctx.rotate(rot || 0);

    ctx.beginPath(); ctx.ellipse(4, 40, 88, 15, 0, 0, Math.PI * 2); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-96, 20);
      ctx.bezierCurveTo(-86, -62, 86, -62, 96, 20);
      ctx.quadraticCurveTo(0, 50, -96, 20);

    for (var i = 0; i <= 10; i++) {
      var u = i / 10;

      var py = 20 + Math.sin(u * Math.PI) * 24;

      ctx.ellipse(px, py, 15, 12, Math.cos(u * Math.PI) * -0.5, 0, Math.PI * 2);

      cg.addColorStop(0.55, '#A96324');
      cg.addColorStop(1, '#5E3010');
      ctx.fillStyle = cg;

    g.addColorStop(0, '#F8C976');
    g.addColorStop(0.2, '#E29B41');
    g.addColorStop(0.5, '#BC6C26');
    g.addColorStop(0.78, '#7E4113');
    g.addColorStop(1, '#4A2409');
    ctx.fillStyle = g;
    ctx.fill();

    /* textura: ampollas tostadas del horno */
    ctx.save();
    bodyPath(); ctx.clip();
    for (var k = 0; k < 14; k++) {
      var bx = -84 + r() * 168, by = -46 + r() * 74;
      ctx.globalAlpha = 0.24 + r() * 0.28;
      ctx.filter = 'blur(' + (3 + r() * 5).toFixed(1) + 'px)';
      ctx.beginPath();
      ctx.ellipse(bx, by, 7 + r() * 17, 4 + r() * 9, r() * 3, 0, Math.PI * 2);
      ctx.fillStyle = r() > 0.45 ? '#6E3810' : '#FFD48C';
      ctx.fill();

    ctx.filter = 'none';
    ctx.globalAlpha = 0.5;

    us.addColorStop(0, 'rgba(60,26,6,0)');
    us.addColorStop(1, 'rgba(48,20,4,0.95)');

    ctx.fillRect(-100, 0, 200, 52);
    ctx.restore();

    /* brillo especular del dorado */
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.3;
    ctx.filter = 'blur(9px)';
    ctx.beginPath();
    ctx.ellipse(-28, -32, 32, 10, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = '#FFE6B4';
    ctx.fill();
    ctx.globalAlpha = 0.62;

    ctx.beginPath();
    ctx.ellipse(-36, -35, 13, 4, -0.32, 0, Math.PI * 2);
    ctx.fillStyle = '#FFF4DC';
    ctx.fill();
    ctx.restore();

    /* luz de contra en el borde superior */
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 4;
    ctx.strokeStyle = U.rgba(C.emberHot, 0.8);
    ctx.beginPath();
    ctx.moveTo(-88, 6);
    ctx.bezierCurveTo(-80, -56, 80, -56, 88, 6);
    ctx.stroke();
    ctx.restore();

    ctx.restore();

  /* Parrilla con brasas, carnes y humo. */
  A.grill = function (ctx, t, o) {
    o = o || {};

    var cy = o.y === undefined ? H * 0.58 : o.y;
    var w = o.w || W * 0.92, h = o.h || 280;

    ctx.restore();

    ctx.strokeStyle = 'rgba(150,110,80,0.35)'; ctx.lineWidth = 5;

    U.rrect(ctx, cx - w / 2 + 14, cy - h / 2 + 14, w - 28, h - 28, 12);
    ctx.clip();
    ctx.fillStyle = '#040201';
    ctx.fillRect(cx - w / 2, cy - h / 2, w, h);

    /* núcleo caliente al centro */
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    var core = ctx.createRadialGradient(cx, cy, 10, cx, cy, w * 0.52);
    core.addColorStop(0, U.rgba(C.ember, 0.13));
    core.addColorStop(0.45, U.rgba(C.ember, 0.07));
    core.addColorStop(1, U.rgba('#3A0C00', 0));
    ctx.fillStyle = core;
    ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
    ctx.restore();

    /* carbones individuales */
    for (var i = 0; i < 40; i++) {
      var ex = cx - w / 2 + 24 + r() * (w - 48);
      var ey = cy - h / 2 + 24 + r() * (h - 48);
      var dCen = 1 - U.clamp(Math.abs(ex - cx) / (w * 0.5), 0, 1) * 0.65;
      var heat = U.clamp((0.2 + 0.8 * U.fbm1(t * 1.5 + i * 2.7, 2)) * dCen, 0, 1);
      var rad = 16 + r() * 34;
      /* carbón apagado */
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#1A0E07';
      ctx.beginPath(); ctx.ellipse(ex, ey, rad * 0.55, rad * 0.38, r() * 3, 0, Math.PI * 2); ctx.fill();
      /* rescoldo encendido */
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = heat * 0.5;
      U.glow(ctx, ex, ey, rad * 1.05, heat > 0.72 ? C.emberHot : C.ember, 0.55);
      ctx.globalAlpha = heat * 0.95;
      ctx.fillStyle = U.mixHex('#4A1503', '#FFD089', Math.pow(heat, 0.8));
      ctx.beginPath(); ctx.ellipse(ex, ey, rad * 0.30, rad * 0.19, r() * 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;

    ctx.globalAlpha = 0.09;
    for (var a = 0; a < 20; a++) {
      ctx.fillStyle = '#C9B7A4';
      ctx.beginPath();
      ctx.ellipse(cx - w / 2 + r() * w, cy - h / 2 + r() * h, 6 + r() * 16, 3 + r() * 7, r() * 3, 0, Math.PI * 2);
      ctx.fill();

    ctx.globalAlpha = 1;
    ctx.restore();

    /* rejilla: pocas barras y gruesas, con brillo metálico */

      ctx.strokeStyle = 'rgba(255,186,120,0.30)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx - w / 2 + 16, by - 4.5); ctx.lineTo(cx + w / 2 - 16, by - 4.5); ctx.stroke();
    }
    ctx.restore();

    /* carnes sobre la rejilla */
    var meats = o.meats || [[-0.29, -0.26, 1.15, 0.10], [0.04, -0.31, 1.05, -0.16],
    [0.32, -0.16, 1.08, 0.2], [-0.30, 0.06, 1.2, -0.1], [-0.02, 0.02, 1.1, 0.16],
    [0.30, 0.12, 1.05, -0.2], [-0.16, 0.30, 1.0, 0.24], [0.17, 0.32, 0.95, -0.12]];
    for (var m = 0; m < meats.length; m++) {

    }

    /* viñeta interior de la parrilla */
    ctx.save();
    U.rrect(ctx, cx - w / 2, cy - h / 2, w, h, 20); ctx.clip();
    var vg = ctx.createRadialGradient(cx, cy, h * 0.15, cx, cy, w * 0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.72)');
    ctx.fillStyle = vg;
    ctx.fillRect(cx - w / 2, cy - h / 2, w, h);

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    U.glow(ctx, cx, cy - h * 0.06, w * 0.42, C.ember, 0.16);
    ctx.restore();
  };

  /* Corte a la parrilla: se dibuja con grosor (cara superior + canto)

  };

  /* Vaso de trago tipo ponche/terremoto, con brindis opcional. */

  /* ---------------- ESCENA 4 — COMIDA + TRAGOS ---------------- */
  function scene4(ctx, t) {
    var lt = t - 12.6;

      var bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#0A0611');
      bg.addColorStop(0.5, '#28130C');
      bg.addColorStop(1, '#0B0504');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      U.glow(ctx, W * 0.5, H * 0.40, W * 0.72, C.ember, 0.26);
      ctx.restore();
      ctx.save();
      ctx.filter = 'blur(16px)';
      ctx.globalAlpha = 0.7;
      A.crowd(ctx, t, { baseY: H * 0.38, count: 8, h: 200, seed: 617, walk: true });
      A.stringLights(ctx, t, { y0: H * 0.11, y1: H * 0.09, sag: 130, count: 12, scale: 1.3 });

      Fx.bokeh(ctx, t, { count: 16, alpha: 0.4, seed: 818 });

      /* brindis: dos vasos que se acercan y chocan */

      var app = U.ease.outCubic(U.norm(t, 13.98, clinkT));
      var rec = U.ease.outQuint(U.norm(t, clinkT, clinkT + 0.5));
      var gap = U.lerp(400, 112, app) + rec * 44;
      var jolt = Math.exp(-Math.max(0, t - clinkT) * 12) * Math.sin((t - clinkT) * 52) * 16;
      if (t < clinkT) jolt = 0;
      A.glass(ctx, W * 0.5 - gap / 2 - jolt, H * 0.525, 1.48, t, 71, 0.10 - app * 0.03);
      A.glass(ctx, W * 0.5 + gap / 2 + jolt, H * 0.520, 1.48, t, 72, -0.10 + app * 0.03);
      if (t >= clinkT && t < clinkT + 0.6) {
        var sparkP = U.norm(t, clinkT, clinkT + 0.5);
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = 1 - sparkP;
        U.glow(ctx, W * 0.5, H * 0.43, 260 * (0.4 + sparkP), C.goldLight, 0.85);

        Fx.sparkles(ctx, t, { count: 16, x: W * 0.5, y: H * 0.43, radius: 300 * (0.3 + sparkP), alpha: 1 - sparkP, seed: 31 });

      bg2.addColorStop(1, '#0B0504');

      ctx.save();
      ctx.filter = 'blur(5px)';
      A.bunting(ctx, t, { y0: H * 0.075, y1: H * 0.095, sag: 110, count: 13, size: 80 });
      ctx.restore();

      /* piso iluminado */
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.35;
      var fl = ctx.createRadialGradient(W * 0.5, H * 0.61, 20, W * 0.5, H * 0.61, W * 0.6);
      fl.addColorStop(0, U.rgba(C.emberHot, 0.6));

      Fx.embers(ctx, t, { count: 34, alpha: 0.7, seed: 606 });

      A.board(ctx, -50, H * 0.575, W + 100, H * 0.46, 818);
      A.pastry(ctx, W * 0.21, H * 0.655, 0.86, -0.1, 61);
      A.pastry(ctx, W * 0.79, H * 0.648, 0.8, 0.14, 62);
      A.glass(ctx, W * 0.50, H * 0.685, 0.8, t, 63, 0);
      Fx.smoke(ctx, t, W * 0.5, H * 0.42, { count: 12, spread: 620, rise: 520, size: 110, alpha: 0.09, seed: 9 });
      ctx.restore();
      Fx.embers(ctx, t, { count: 40, alpha: 0.8, seed: 707 });

    /* Etiquetas — una por plano */

      { text: 'Y MUCHO SABOR', glyph: 'heart', t0: 16.82, t1: 17.95 }

      var gp = U.ease.outBack(U.norm(t, L.t0 + 0.18, L.t0 + 0.6));

  /* ---------------- ESCENA 5 — FECHAS ---------------- */
  function scene5(ctx, t) {
    var lt = t - 18.0;

    });

      ctx.scale(punch, punch);

      Ty.line(ctx, {

          text: '•', spec: sepSpec, x: cxs, y: yNum - 54,

      fill: Ty.FILL.gold, shadow: { color: 'rgba(0,0,0,0.85)', blur: 30, y: 10 }
    });
    Ty.rule(ctx, W / 2, 972, 700, U.norm(t, 20.05, 20.5), C.gold, 5);

    /* Horario */
    Ty.line(ctx, {
      text: 'Desde las 10:00 AM',
      spec: { family: Ty.FAM.sans, size: 84, weight: 800, spacing: 0 },
      x: W / 2, y: 1112, maxWidth: W - 190,
      mode: 'words', stagger: 0.42, p: U.norm(t, 20.55, 21.05), pOut: pOutAll,
      dy: 48, scaleIn: 1.08, blurIn: 14,
      fill: Ty.FILL.cream, shadow: { color: 'rgba(0,0,0,0.85)', blur: 28, y: 9 }
    });
    Ty.line(ctx, {
      text: 'hasta que cierre la fonda',

      x: W / 2, y: 1206, maxWidth: W - 210,
      mode: 'words', stagger: 0.42, p: U.norm(t, 21.25, 21.75), pOut: pOutAll,

    Fx.sparkles(ctx, t, { count: 14, x: W / 2, y: 830, radius: W * 0.5, alpha: 0.5, seed: 2211 });
    ctx.restore();

  /* ---------------- ESCENA 6 — CIERRE / CTA ---------------- */
  function scene6(ctx, t) {

    var q = U.norm(lt, 0, 5.4);

    U.glow(ctx, W * 0.5, H * 0.34, W * 0.95, C.ember, 0.3);
    U.glow(ctx, W * 0.5, H * 0.88, W * 0.6, C.red, 0.2);
    ctx.restore();

    /* gentío celebrando al fondo */
    ctx.save();
    ctx.filter = 'blur(14px)';
    ctx.globalAlpha = 0.72;
    A.crowd(ctx, t, { baseY: H * 0.93, count: 11, h: 260, seed: 1313, walk: true, spread: 44 });
    ctx.restore();

    A.stringLights(ctx, t, { y0: H * 0.10, y1: H * 0.078, sag: 132, count: 15, scale: 1.15 });
    A.stringLights(ctx, t, { y0: H * 0.955, y1: H * 0.975, sag: -110, count: 12, phase: 2.4, scale: 0.95 });
    ctx.save();
    ctx.filter = 'blur(4px)';
    A.bunting(ctx, t, { y0: H * 0.035, y1: H * 0.055, sag: 92, count: 13, size: 74 });
    ctx.restore();

    /* banderas ondeando a los costados */
    var fw = U.ease.outCubic(U.norm(lt, 0.1, 0.7));
    ctx.save();
    ctx.globalAlpha = fw;
    ctx.save();
    ctx.translate(0, (1 - fw) * 90);
    G.flag(ctx, W * 0.115, H * 0.30, 200, t * 1.05, 1.15);
    G.flag(ctx, W * 0.885, H * 0.30, 200, t * 1.05 + 1.7, 1.15);
    ctx.restore();
    ctx.restore();

    ctx.restore(); /* cámara */

    /* Emblema de marca */
    var ep = U.ease.outBack(U.norm(lt, 0.05, 0.75), 1.15);
    if (ep > 0.01) {
      ctx.save();
      ctx.globalAlpha = U.clamp(ep, 0, 1);
      ctx.translate(W / 2, 560);
      var es = U.clamp(ep, 0.01, 1.05) * (1 + Math.sin(t * 1.6) * 0.008);
      ctx.scale(es, es);
      ctx.rotate((1 - ep) * 0.18);
      ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 18;
      G.emblem(ctx, 0, 0, 430, {});
      ctx.restore();
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.5 * U.clamp(ep, 0, 1);
      U.glow(ctx, W / 2, 560, 340, C.gold, 0.4);
      ctx.restore();
    }
    Ty.shine(ctx, W / 2, 560, 520, 520, U.norm(t, 24.35, 25.15), 0.5);

    /* CTA */
    ctx.save();
    ctx.globalAlpha = U.norm(t, 24.0, 24.35);
    Ty.scrim(ctx, W / 2, 1090, W * 1.25, 560, 0.66);
    ctx.restore();

    Ty.line(ctx, {
      text: 'TE ESPERAMOS EN',
      spec: { family: Ty.FAM.sans, size: 62, weight: 700, spacing: 6 },
      x: W / 2, y: 900, maxWidth: W - 200,
      mode: 'words', stagger: 0.4, p: U.norm(t, 24.05, 24.5),
      dy: 40, scaleIn: 1.05, blurIn: 12,
      fill: Ty.FILL.cream, shadow: { color: 'rgba(0,0,0,0.85)', blur: 26, y: 8 }
    });
    Ty.line(ctx, {
      text: 'SANTO DOMINGO',
      spec: { family: Ty.FAM.display, size: 142, weight: 400, spacing: 0 },
      x: W / 2, y: 1032, maxWidth: W - 150,
      mode: 'chars', stagger: 0.5, p: U.norm(t, 24.28, 24.88),
      dy: 80, scaleIn: 1.18, blurIn: 20, ease: U.ease.slam,
      fill: Ty.FILL.gold, shadow: { color: 'rgba(0,0,0,0.9)', blur: 40, y: 12 },
      glow: { color: C.ember, alpha: 0.35 }
    });
    var fp = U.ease.outBack(U.norm(t, 24.7, 25.2));
    if (fp > 0.01) {
      ctx.save();
      ctx.globalAlpha = U.clamp(fp, 0, 1);
      G.flag(ctx, W / 2, 1122, 92 * U.clamp(fp, 0, 1.05), t * 0.95, 1);
      ctx.restore();
    }

    Ty.line(ctx, {
      text: 'LA COCINA DEL TATA',
      spec: { family: Ty.FAM.brand, size: 80, weight: 400, spacing: 1 },
      x: W / 2, y: 1248, maxWidth: W - 170,
      mode: 'chars', stagger: 0.45, p: U.norm(t, 25.0, 25.6),
      dy: 52, scaleIn: 1.1, blurIn: 16,
      fill: Ty.FILL.cream, shadow: { color: 'rgba(0,0,0,0.85)', blur: 30, y: 10 }
    });
    Ty.rule(ctx, W / 2, 1288, 620, U.norm(t, 25.5, 25.95), C.gold, 4);

    var ctaP = U.norm(t, 25.75, 26.25);
    var ctaBox = Ty.line(ctx, {
      text: 'VEN A CELEBRAR CON NOSOTROS',
      spec: { family: Ty.FAM.sans, size: 52, weight: 600, spacing: 2 },
      x: W / 2 - 34, y: 1372, maxWidth: W - 260,
      mode: 'words', stagger: 0.4, p: ctaP,
      dy: 34, scaleIn: 1.04, blurIn: 10,
      fill: Ty.FILL.cream, shadow: { color: 'rgba(0,0,0,0.85)', blur: 22, y: 7 }
    });
    var hp = U.ease.outBack(U.norm(t, 26.1, 26.55));
    if (hp > 0.01) {
      ctx.save();
      ctx.globalAlpha = U.clamp(hp, 0, 1);
      var beat = 1 + Math.pow(Math.max(0, Math.sin((t - 26.1) * 3.6)), 6) * 0.16;
      G.heart(ctx, ctaBox.right + 56, 1356, 62 * U.clamp(hp, 0, 1.05) * beat);
      ctx.restore();
    }

    /* Franja final */
    var sp = U.norm(t, 26.4, 26.9);
    if (sp > 0) {
      ctx.save();
      ctx.globalAlpha = sp;
      var bw = 880 * U.ease.outQuint(sp), bh = 76;
      U.rrect(ctx, W / 2 - bw / 2, 1448, bw, bh, 38);
      var bgg = ctx.createLinearGradient(W / 2 - bw / 2, 0, W / 2 + bw / 2, 0);
      bgg.addColorStop(0, U.rgba(C.redDeep, 0.9));
      bgg.addColorStop(0.5, U.rgba(C.red, 0.95));
      bgg.addColorStop(1, U.rgba(C.redDeep, 0.9));
      ctx.fillStyle = bgg; ctx.fill();
      ctx.strokeStyle = U.rgba(C.gold, 0.8); ctx.lineWidth = 3;
      U.rrect(ctx, W / 2 - bw / 2, 1448, bw, bh, 38); ctx.stroke();
      ctx.restore();
      Ty.line(ctx, {
        text: 'COMIDA • TRAGOS • MÚSICA • TRADICIÓN',
        spec: { family: Ty.FAM.sans, size: 40, weight: 700, spacing: 3 },
        x: W / 2, y: 1500, maxWidth: 820,
        mode: 'block', p: U.norm(t, 26.55, 26.95),
        dy: 20, scaleIn: 1.03, blurIn: 8,
        fill: Ty.FILL.gold
      });
    }

    /* Celebración */
    Fx.confetti(ctx, t, 23.45, { count: 88, alpha: 0.9, spread: 3.0, seed: 4040 });
    Fx.confetti(ctx, t, 26.3, { count: 44, alpha: 0.85, spread: 1.1, seed: 5151 });
    Fx.embers(ctx, t, { count: 40, alpha: 0.8, seed: 808 });
    ctx.save();
    ctx.globalAlpha = 0.8;
    Fx.sparkles(ctx, t, { count: 20, x: W / 2, y: 620, radius: W * 0.55, alpha: 0.7, seed: 6161 });
    ctx.restore();
  }

  /* ---------------- MONTAJE ---------------- */

  var SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];

  function sceneIndex(t) {
    for (var i = CUT.length - 2; i >= 0; i--) if (t >= CUT[i]) return i;
    return 0;
  }

  R.render = function (ctx, t, opts) {
    opts = opts || {};
    t = U.clamp(t, 0, R.DURATION - 0.0001);
    var canvas = ctx.canvas;

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    var fx = cutFX(t);

    ctx.save();
    if (fx.dx || fx.sc !== 1) {
      ctx.translate(W / 2, H / 2);
      ctx.scale(fx.sc, fx.sc);
      ctx.translate(-W / 2 + fx.dx, -H / 2);
    }
    SCENES[sceneIndex(t)](ctx, t);
    ctx.restore();

    /* Desenfoque direccional del corte (copias desplazadas) */
    if (fx.blur > 0.6 && opts.quality !== 'low') {
      ctx.save();
      ctx.globalAlpha = 0.34;
      for (var i = 1; i <= 3; i++) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.14;
        ctx.drawImage(canvas, fx.blur * i * 1.6, 0, W, H, 0, 0, W, H);
        ctx.drawImage(canvas, -fx.blur * i * 1.6, 0, W, H, 0, 0, W, H);
      }
      ctx.restore();
    }

    /* Post-proceso */
    if (opts.quality !== 'low') {
      Fx.bloom(canvas, ctx, 0.42, 1.5);
      Fx.lightLeak(ctx, t, 0.16, 5);
    }
    Fx.flash(ctx, fx.flash, '#FFE7C4');
    Fx.vignette(ctx, 0.62, '#05030A');

    /* Gradación cálida final */
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.16;
    var grade = ctx.createLinearGradient(0, 0, 0, H);
    grade.addColorStop(0, '#2A4E8C');
    grade.addColorStop(0.5, '#FFB067');
    grade.addColorStop(1, '#5B1E12');
    ctx.fillStyle = grade;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    Fx.grain(ctx, t, opts.quality === 'low' ? 0.08 : 0.115);

    /* Fundido de entrada y salida */
    var fadeIn = 1 - U.norm(t, 0, 0.18);
    var fadeOut = U.norm(t, R.DURATION - 0.42, R.DURATION - 0.02);
    if (fadeIn > 0 || fadeOut > 0) {
      ctx.save();
      ctx.globalAlpha = Math.max(fadeIn, fadeOut);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    if (opts.safeGuides) {
      ctx.save();
      ctx.strokeStyle = 'rgba(0,255,190,0.55)';
      ctx.lineWidth = 3;
      ctx.setLineDash([16, 14]);
      ctx.strokeRect(R.SAFE.left, R.SAFE.top, R.SAFE.right - R.SAFE.left, R.SAFE.bottom - R.SAFE.top);
      ctx.restore();

  R.CUT = CUT;
  R.sceneIndex = sceneIndex;
  R.SCENE_NAMES = ['HOOK', 'INVITACIÓN', 'LA COCINA DEL TATA', 'COMIDA + TRAGOS', 'FECHAS', 'CIERRE'];

  T.R = R;
})(window.TATA = window.TATA || {});

<script>
/* player.js — reproductor, reloj y exportadores del reel. */
(function (T) {
  'use strict';
  var U = T.U, R = T.R, Au = T.Au;

  var canvas = document.getElementById('reel');
  var ctx = canvas.getContext('2d', { alpha: false });
  var overlay = document.getElementById('overlay');
  var bar = document.getElementById('bar');
  var clock = document.getElementById('clock');
  var sceneName = document.getElementById('sceneName');
  var fpsEl = document.getElementById('fps');
  var status = document.getElementById('status');

  var btnPlay = document.getElementById('btnPlay');
  var btnRestart = document.getElementById('btnRestart');
  var btnSound = document.getElementById('btnSound');
  var btnRec = document.getElementById('btnRec');
  var btnFrame = document.getElementById('btnFrame');
  var btnWav = document.getElementById('btnWav');
  var btnSafe = document.getElementById('btnSafe');

  var state = {
    playing: false,
    t: 0,
    last: 0,
    safe: false,
    sound: true,
    recording: false
  };

  var player = new Au.Player(R.DURATION);

  function say(msg) { status.textContent = msg; }

  /* En la página publicada el visor bloquea las descargas que inicia la propia
     página, así que se ocultan esos botones en lugar de dejarlos sin efecto. */
  if (window.TATA_ARTIFACT) {
    [btnRec, btnFrame, btnWav].forEach(function (b) { if (b) b.remove(); });
  }

  function draw(t) {
    R.render(ctx, t, { safeGuides: state.safe });
    bar.style.width = ((t / R.DURATION) * 100).toFixed(2) + '%';
    clock.textContent = t.toFixed(1) + 's / ' + R.DURATION.toFixed(1) + 's';
    sceneName.textContent = R.SCENE_NAMES[R.sceneIndex(t)];
  }

  /* ---- bucle ---- */
  var frames = 0, fpsT = 0;
  function loop(now) {
    if (!state.playing) return;
    var dt = (now - state.last) / 1000;
    state.last = now;
    if (dt > 0.25) dt = 1 / 60;
    state.t += dt;

    frames++;
    if (now - fpsT > 500) {
      fpsEl.textContent = Math.round((frames * 1000) / (now - fpsT)) + ' fps';
      frames = 0; fpsT = now;
    }

    if (state.t >= R.DURATION) {
      state.t = R.DURATION - 0.001;
      draw(state.t);
      stop(true);
      return;
    }
    draw(state.t);
    requestAnimationFrame(loop);
  }

  function start(fromZero) {
    if (fromZero) state.t = 0;
    if (state.t >= R.DURATION - 0.01) state.t = 0;
    overlay.classList.add('hidden');
    state.playing = true;
    state.last = performance.now();
    fpsT = state.last; frames = 0;
    btnPlay.textContent = 'Pausar';
    player.init().then(function () {
      if (state.playing) player.play(state.t);
      say(player.external === false
        ? 'Sonando pista sintetizada (cueca, palmas, bombo y guitarra).'
        : 'Sonando assets/audio/track.mp3.');
    });
    requestAnimationFrame(loop);
  }

  function stop(ended) {
    state.playing = false;
    player.stop();
    btnPlay.textContent = ended ? 'Ver de nuevo' : 'Reproducir';
    if (ended && !state.recording) {
      overlay.classList.remove('hidden');
      say('Reel finalizado. 28,8 s · 1080×1920.');
    }
  }

  btnPlay.addEventListener('click', function () {
    if (state.playing) { stop(false); say('En pausa.'); }
    else start(false);
  });
  overlay.addEventListener('click', function () { start(state.t >= R.DURATION - 0.01); });
  btnRestart.addEventListener('click', function () { start(true); });

  btnSound.addEventListener('click', function () {
    state.sound = !state.sound;
    player.setMuted(!state.sound);
    btnSound.dataset.on = String(state.sound);
    btnSound.textContent = 'Sonido: ' + (state.sound ? 'ON' : 'OFF');
  });

  btnSafe.addEventListener('click', function () {
    state.safe = !state.safe;
    btnSafe.dataset.on = String(state.safe);
    draw(state.t);
    say(state.safe
      ? 'Guía de zona segura: todo el texto queda fuera de la interfaz de Reels/TikTok.'
      : 'Guía desactivada.');
  });

  /* ---- exportar frame ---- */
  btnFrame.addEventListener('click', function () {
    canvas.toBlob(function (b) {
      download(b, 'cocina-del-tata-' + state.t.toFixed(1).replace('.', '_') + 's.png');
      say('Frame guardado en 1080×1920.');
    }, 'image/png');
  });

  /* ---- exportar música ---- */
  btnWav.addEventListener('click', function () {
    btnWav.disabled = true;
    say('Generando pista…');
    setTimeout(function () {
      var track = Au.build(44100, R.DURATION);
      var wav = Au.toWav(track);
      download(new Blob([wav], { type: 'audio/wav' }), 'cocina-del-tata-pista.wav');
      btnWav.disabled = false;
      say('Pista WAV descargada (44,1 kHz estéreo).');
    }, 30);
  });

  /* ---- grabar video (con audio) ---- */
  function pickMime() {
    var opts = [
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    for (var i = 0; i < opts.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(opts[i])) return opts[i];
    }
    return '';
  }

  btnRec.addEventListener('click', function () {
    if (state.recording) return;
    if (!window.MediaRecorder || !canvas.captureStream) {
      say('Este navegador no permite grabar. Usa npm run export en el proyecto.');
      return;
    }
    player.init().then(function () {
      var mime = pickMime();
      var stream = canvas.captureStream(30);
      var dest = player.streamDestination();
      if (dest && state.sound) {
        dest.stream.getAudioTracks().forEach(function (tr) { stream.addTrack(tr); });
      }
      var rec;
      try {
        rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 12000000 } : undefined);
      } catch (e) {
        say('No se pudo iniciar la grabación: ' + e.message);
        return;
      }
      var chunks = [];
      rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      rec.onstop = function () {
        var type = rec.mimeType || mime || 'video/webm';
        var ext = type.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
        download(new Blob(chunks, { type: type }), 'cocina-del-tata-reel.' + ext);
        state.recording = false;
        btnRec.disabled = false;
        btnRec.textContent = 'Grabar video';
        say('Video ' + ext.toUpperCase() + ' descargado (1080×1920, con audio).');
      };
      state.recording = true;
      btnRec.disabled = true;
      btnRec.textContent = 'Grabando…';
      say('Grabando en tiempo real. No cambies de pestaña.');
      rec.start(200);
      start(true);
      var check = setInterval(function () {
        if (!state.playing) {
          clearInterval(check);
          setTimeout(function () { if (rec.state !== 'inactive') rec.stop(); }, 260);
        }
      }, 120);
    });
  });

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

  /* ---- teclado ---- */
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); state.playing ? stop(false) : start(false); }
    if (e.code === 'ArrowRight') { state.t = Math.min(R.DURATION - 0.01, state.t + 0.5); draw(state.t); }
    if (e.code === 'ArrowLeft') { state.t = Math.max(0, state.t - 0.5); draw(state.t); }
    if (e.key === 'r' || e.key === 'R') start(true);
  });

  /* ---- clic en la barra para saltar ---- */
  document.querySelector('.scrubber').addEventListener('click', function (e) {
    var r = this.getBoundingClientRect();
    state.t = U.clamp((e.clientX - r.left) / r.width, 0, 0.999) * R.DURATION;
    draw(state.t);
  });

  /* ---- API para el exportador headless ---- */
  window.REEL = {
    duration: R.DURATION,
    fps: R.FPS,
    seek: function (t) { state.playing = false; R.render(ctx, t, {}); },
    frameData: function (t, quality) {
      state.playing = false;
      R.render(ctx, t, {});
      return canvas.toDataURL('image/jpeg', quality || 0.94);
    },
    audioWav: function () {
      var track = Au.build(44100, R.DURATION);
      var buf = Au.toWav(track);
      var bytes = new Uint8Array(buf), s = '';
      for (var i = 0; i < bytes.length; i += 0x8000) {
        s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      }
      return btoa(s);
    }
  };

  /* Primer frame visible de inmediato. */
  document.fonts.ready.then(function () {
    draw(0.9);
    window.REEL.ready = true;
  });
})(window.TATA);

</script>
